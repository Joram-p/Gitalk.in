<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login | Gitalk.in</title><link rel="stylesheet" href="style.css"></head><body>
<header class="topbar"><a class="brand" href="index.html"><span class="brand-mark">G</span><span>Gitalk<span class="dot">.in</span><small>ADMIN CONSOLE</small></span></a><a class="admin-link" href="index.html">Back to website</a></header>
<main class="admin-box"><span class="eyebrow">OWNER ACCESS ONLY</span><h1>Admin Login</h1><p class="notice">केवल अधिकृत वेबसाइट मालिक के लिए। पहले Firebase setup करके अपना admin UID configure करें।</p>
<div id="loginPanel"><label>Email</label><input class="field" type="email" id="email" autocomplete="username"><label>Password</label><input class="field" type="password" id="password" autocomplete="current-password"><button class="btn primary" id="login">Secure Login</button><p id="status" class="result">Firebase configuration आवश्यक है।</p></div>
<div id="dashboard" class="hidden"><h2>Website content update</h2><p id="who" class="notice"></p><label>Update title</label><input class="field" id="postTitle" placeholder="जैसे: New English lesson"><label>Update details</label><textarea class="field" id="postBody" rows="5" placeholder="Lesson या announcement लिखें"></textarea><button class="btn primary" id="publish">Publish update</button> <button class="btn secondary" id="logout">Logout</button><p id="adminStatus" class="result"></p><h3>Published updates</h3><div id="updates"></div></div>
</main><script type="module" src="admin.js"></script></body></html>
