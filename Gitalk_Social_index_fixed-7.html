<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Gitalk Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#087cf5,#08b8b0,#00c853);min-height:100vh;color:#222}
.wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:25px}
.card{width:100%;max-width:620px;background:#fff;border-radius:28px;padding:35px;box-shadow:0 15px 45px #0004}
.logo{text-align:center;font-size:52px;font-weight:700;color:#087bea;margin:5px 0}
.tag{text-align:center;color:#666;font-size:21px;margin-bottom:30px}
h2{text-align:center;font-size:30px;margin:10px 0 25px}
input{width:100%;padding:17px 18px;border:1px solid #ccc;border-radius:14px;font-size:17px;margin:7px 0}
button{width:100%;border:0;border-radius:14px;padding:16px;font-size:18px;font-weight:700;cursor:pointer;margin-top:10px;background:#087cf5;color:#fff}
button:hover{opacity:.9}
.secondary{background:#fff;color:#087cf5;border:0}
.hidden{display:none!important}
.msg{text-align:center;margin:15px 0;padding:12px;border-radius:10px;display:none}
.ok{background:#e8fff0;color:#087a35}
.err{background:#ffe9e9;color:#b00020}
.small{text-align:center;color:#666;margin-top:16px}
.link{color:#087bea;font-weight:700;cursor:pointer;text-align:center;margin-top:20px;font-size:18px}
.home{display:none}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:15px;margin-bottom:20px}
.top .logo2{font-size:30px;font-weight:bold;color:#087bea}
.logout{width:auto;padding:10px 18px;margin:0;background:#222}
.profilebox{text-align:center;padding:25px;background:#f4f7fb;border-radius:18px}
.avatar{width:85px;height:85px;border-radius:50%;background:#087bea;color:#fff;display:flex;align-items:center;justify-content:center;margin:auto;font-size:35px;font-weight:bold}
#userEmail{color:#666;margin-top:10px}
</style>
</head>
<body>

<div class="wrap">
<div class="card">

  <!-- LOGIN -->
  <section id="loginBox">
    <div class="logo">Gitalk</div>
    <div class="tag">Connect • Chat • Share</div>
    <h2>Login</h2>

    <div id="loginMsg" class="msg"></div>

    <input id="loginEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginBtn" type="button">Login</button>

    <div id="openRegister" class="link">Create New Account</div>
  </section>

  <!-- REGISTER -->
  <section id="registerBox" class="hidden">
    <div class="logo">Gitalk</div>
    <div class="tag">Create your social account</div>
    <h2>Create Account</h2>

    <div id="registerMsg" class="msg"></div>

    <input id="fullName" type="text" placeholder="Full Name" autocomplete="name">
    <input id="username" type="text" placeholder="Username" autocomplete="username">
    <input id="registerEmail" type="email" placeholder="Email" autocomplete="email">
    <input id="registerPassword" type="password" placeholder="Password (minimum 6 characters)" autocomplete="new-password">

    <button id="registerBtn" type="button">Create Account</button>
    <div id="backLogin" class="link">← Back to Login</div>
  </section>

  <!-- HOME -->
  <section id="homeBox" class="home">
    <div class="top">
      <div class="logo2">Gitalk</div>
      <button id="logoutBtn" class="logout" type="button">Logout</button>
    </div>

    <div class="profilebox">
      <div id="avatar" class="avatar">G</div>
      <h2 id="welcomeName">Welcome</h2>
      <div id="userEmail"></div>
      <p id="welcomeUsername"></p>
    </div>

    <div class="small">Login is working successfully. Friends and Chat can be added next. ❤️</div>
  </section>

</div>
</div>

<script>
const SUPABASE_URL = "https://mhnfutbpvyvhdmqqquyi.supabase.co";
const SUPABASE_KEY = "sb_publishable_NpULKcoHIfa0urWJH0oOPA_o9vqamOl";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const loginBox = document.getElementById("loginBox");
const registerBox = document.getElementById("registerBox");
const homeBox = document.getElementById("homeBox");

function showMsg(id,text,type){
  const el=document.getElementById(id);
  el.textContent=text;
  el.className="msg "+type;
  el.style.display="block";
}
function hideMsg(id){
  const el=document.getElementById(id);
  el.style.display="none";
}

function showLogin(){
  loginBox.classList.remove("hidden");
  registerBox.classList.add("hidden");
  homeBox.style.display="none";
  hideMsg("registerMsg");
}
function showRegister(){
  loginBox.classList.add("hidden");
  registerBox.classList.remove("hidden");
  homeBox.style.display="none";
  hideMsg("loginMsg");
}

document.getElementById("openRegister").addEventListener("click", showRegister);
document.getElementById("backLogin").addEventListener("click", showLogin);

async function ensureProfile(user, name="", username=""){
  const {data,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error) throw error;

  if(!data){
    const base=(username || (user.email||"user").split("@")[0])
      .toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,30) || "user";
    const finalName=name || user.user_metadata?.full_name || base;

    const {error:insertError}=await sb.from("profiles").insert({
      id:user.id,
      username:base,
      full_name:finalName
    });
    if(insertError && !String(insertError.message).toLowerCase().includes("duplicate")){
      throw insertError;
    }
  }
}

async function openHome(user){
  loginBox.classList.add("hidden");
  registerBox.classList.add("hidden");
  homeBox.style.display="block";

  let profile=null;
  const result=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(!result.error) profile=result.data;

  const name=profile?.full_name || user.user_metadata?.full_name || "Gitalk User";
  const username=profile?.username ? "@"+profile.username : "";
  document.getElementById("welcomeName").textContent="Welcome, "+name;
  document.getElementById("welcomeUsername").textContent=username;
  document.getElementById("userEmail").textContent=user.email || "";
  document.getElementById("avatar").textContent=(name.charAt(0)||"G").toUpperCase();
}

document.getElementById("registerBtn").addEventListener("click", async ()=>{
  hideMsg("registerMsg");

  const fullName=document.getElementById("fullName").value.trim();
  const username=document.getElementById("username").value.trim().toLowerCase();
  const email=document.getElementById("registerEmail").value.trim();
  const password=document.getElementById("registerPassword").value;

  if(!fullName || !username || !email || !password){
    showMsg("registerMsg","Please fill all fields.","err"); return;
  }
  if(password.length<6){
    showMsg("registerMsg","Password must be at least 6 characters.","err"); return;
  }

  const btn=document.getElementById("registerBtn");
  btn.disabled=true;
  btn.textContent="Creating Account...";

  try{
    const {data,error}=await sb.auth.signUp({
      email,
      password,
      options:{data:{full_name:fullName,username}}
    });

    if(error) throw error;

    if(data.session && data.user){
      try{
        await ensureProfile(data.user,fullName,username);
      }catch(profileError){
        showMsg("registerMsg","Account created, but profile setup failed: "+profileError.message,"err");
        return;
      }
      showMsg("registerMsg","Account created successfully!","ok");
      setTimeout(()=>openHome(data.user),500);
    }else{
      showMsg("registerMsg","Account created. Please check your email and confirm it, then return here and Login.","ok");
    }

  }catch(e){
    showMsg("registerMsg",e.message || "Registration failed.","err");
  }finally{
    btn.disabled=false;
    btn.textContent="Create Account";
  }
});

document.getElementById("loginBtn").addEventListener("click", async ()=>{
  hideMsg("loginMsg");

  const email=document.getElementById("loginEmail").value.trim();
  const password=document.getElementById("loginPassword").value;

  if(!email || !password){
    showMsg("loginMsg","Please enter email and password.","err"); return;
  }

  const btn=document.getElementById("loginBtn");
  btn.disabled=true;
  btn.textContent="Logging in...";

  try{
    const {data,error}=await sb.auth.signInWithPassword({email,password});
    if(error) throw error;

    if(data.user){
      try{ await ensureProfile(data.user); }catch(profileError){}
      await openHome(data.user);
    }
  }catch(e){
    showMsg("loginMsg",e.message || "Login failed.","err");
  }finally{
    btn.disabled=false;
    btn.textContent="Login";
  }
});

document.getElementById("logoutBtn").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  showLogin();
});

sb.auth.onAuthStateChange(async (event,session)=>{
  if(session?.user && event==="SIGNED_IN"){
    await openHome(session.user);
  }
});

(async()=>{
  const {data}=await sb.auth.getSession();
  if(data.session) await openHome(data.session.user);
})();
</script>
</body>
</html>
