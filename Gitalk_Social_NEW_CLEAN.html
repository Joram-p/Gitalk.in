<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gitalk Social</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#078cf0,#00c99a);min-height:100vh;color:#222}.wrap{max-width:760px;margin:auto;padding:10px}.card{background:#fff;border-radius:20px;padding:18px;margin:10px 0;box-shadow:0 8px 30px #0002}.logo{font-size:36px;font-weight:800;color:#087fe5;text-align:center}h2{margin:8px 0 14px}input,textarea{width:100%;padding:13px;margin:6px 0;border:1px solid #ccc;border-radius:11px;font-size:16px}textarea{resize:vertical}button{border:0;border-radius:11px;padding:11px 15px;font-weight:700;cursor:pointer}.primary{background:#087fe5;color:#fff}.light{background:#eef3f8}.dark{background:#222;color:#fff}.hidden{display:none!important}.msg{padding:11px;margin-top:10px;border-radius:10px;background:#f2f5f9}.ok{color:#087c45}.err{color:#c00}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ddd;padding-bottom:12px}header .logo{text-align:left}nav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:14px 0}nav button{padding:9px 3px;font-size:12px}.row{display:flex;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #eee}.userinfo{display:flex;gap:9px;align-items:center;flex:1}.avatar{width:45px;height:45px;border-radius:50%;background:#087fe5;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:bold}.small{font-size:13px;color:#666}.bubble{max-width:80%;padding:10px;border-radius:14px;margin:6px 0}.mine{margin-left:auto;background:#087fe5;color:#fff}.theirs{background:#e9edf2}#chatBox{height:320px;overflow:auto;border:1px solid #ddd;border-radius:12px;padding:10px}.post{border:1px solid #ddd;border-radius:14px;padding:13px;margin:12px 0}.post-media{max-width:100%;max-height:430px;border-radius:10px;margin-top:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.notif{padding:11px;border-bottom:1px solid #eee}.unread{background:#eef7ff;font-weight:bold}@media(max-width:500px){.logo{font-size:31px}nav button{font-size:11px}}
</style>
</head>
<body>
<div class="wrap">
<div id="auth" class="card">
<div class="logo">Gitalk</div><p style="text-align:center;color:#666">Social Network</p>
<div id="loginBox"><h2>🔐 Login</h2><input id="loginEmail" type="email" placeholder="Email"><input id="loginPassword" type="password" placeholder="Password"><button id="loginBtn" class="primary" style="width:100%" onclick="login()">Login</button><p style="text-align:center">New user? <button class="light" onclick="toggleAuth()">Create Account</button></p></div>
<div id="registerBox" class="hidden"><h2>📝 Create Account</h2><input id="regName" placeholder="Full name"><input id="regUsername" placeholder="Username"><input id="regEmail" type="email" placeholder="Email"><input id="regPassword" type="password" placeholder="Password (6+ characters)"><button class="primary" style="width:100%" onclick="register()">Create Account</button><p style="text-align:center"><button class="light" onclick="toggleAuth()">← Login</button></p></div>
<div id="authMsg"></div></div>

<div id="app" class="hidden"><div class="card">
<header><div class="logo">Gitalk</div><button class="dark" onclick="logout()">Logout</button></header>
<nav><button class="light" onclick="show('home')">🏠 Home</button><button class="light" onclick="show('profile')">👤 Profile</button><button class="light" onclick="show('search')">🔎 Search</button><button class="light" onclick="show('friends');loadFriends()">👥 Friends</button><button class="light" onclick="show('posts');loadPosts()">📰 Posts</button><button class="light" onclick="show('notifications');loadNotifications()">🔔 Notifications <span id="notifBadge"></span></button></nav>

<section id="home"><h2>Welcome, <span id="homeName"></span> ❤️</h2><p class="small">Gitalk Social is connected.</p><div class="msg ok">Login successful.</div></section>

<section id="profile" class="hidden"><h2>👤 Profile Settings</h2><input id="profileName" placeholder="Full name"><input id="profileUsername" placeholder="Username"><textarea id="profileBio" rows="3" placeholder="Bio"></textarea><button class="primary" onclick="saveProfile()">Save Profile</button><div id="profileMsg"></div></section>

<section id="search" class="hidden"><h2>🔎 Search Users</h2><input id="searchInput" placeholder="Search name or username"><button class="primary" onclick="searchUsers()">Search</button><div id="searchResults"></div></section>

<section id="friends" class="hidden"><h2>🤝 Friend Requests</h2><div id="requests"></div><h2>👥 My Friends</h2><div id="friendsList"></div></section>

<section id="posts" class="hidden"><h2>📰 Posts</h2><textarea id="postText" rows="3" placeholder="What's on your mind?"></textarea><input id="postMedia" type="file" accept="image/*,video/*"><button class="primary" onclick="createPost()">🚀 Post</button><div id="postsFeed"></div></section>

<section id="notifications" class="hidden"><h2>🔔 Notifications</h2><button class="light" onclick="markNotificationsRead()">Mark all as read</button><div id="notificationsList"></div></section>

<section id="chat" class="hidden"><h2>💬 <span id="chatName"></span></h2><div id="chatBox"></div><div style="display:flex;gap:6px"><input id="messageInput" placeholder="Write a message..." onkeydown="if(event.key==='Enter')sendMessage()"><button class="primary" onclick="sendMessage()">Send</button></div><input id="mediaInput" type="file" accept="image/*,video/*"><button class="light" onclick="show('friends')">← Friends</button></section>
</div></div></div>

<script>
"use strict";
const SUPABASE_URL="https://mhnfutbpvyvhdmqqquyi.supabase.co";
const SUPABASE_KEY="sb_publishable_NpULKcoHIfa0urWJH0oOPA_o9vqamOl";
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentProfile=null,chatUser=null,chatChannel=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
function msg(id,t,good=false){$(id).innerHTML='<div class="msg '+(good?'ok':'err')+'">'+esc(t)+'</div>'}
function show(id){document.querySelectorAll("section").forEach(x=>x.classList.add("hidden"));if($(id))$(id).classList.remove("hidden")}
function toggleAuth(){$("loginBox").classList.toggle("hidden");$("registerBox").classList.toggle("hidden");$("authMsg").innerHTML=""}

async function login(){
 const email=$("loginEmail").value.trim(),password=$("loginPassword").value,btn=$("loginBtn");
 if(!email||!password){msg("authMsg","Enter email and password.");return}
 btn.disabled=true;btn.textContent="Signing in...";
 try{
  const {data,error}=await supabaseClient.auth.signInWithPassword({email,password});
  if(error)throw error;
  if(!data?.user)throw new Error("No user returned.");
  currentUser=data.user;
  $("auth").classList.add("hidden");$("app").classList.remove("hidden");$("homeName").textContent=currentUser.email||"Gitalk User";show("home");
  try{await ensureProfile()}catch(e){console.error(e)}
  if(currentProfile)$("homeName").textContent=currentProfile.full_name||currentProfile.username||currentUser.email;
  setTimeout(()=>loadNotifications().catch(console.error),500);
 }catch(e){msg("authMsg","Login failed: "+(e.message||e))}
 finally{btn.disabled=false;btn.textContent="Login"}
}

async function register(){
 const name=$("regName").value.trim(),username=$("regUsername").value.trim().toLowerCase(),email=$("regEmail").value.trim(),password=$("regPassword").value;
 if(!email||!password||!username){msg("authMsg","Please fill required fields.");return}
 if(password.length<6){msg("authMsg","Password must be at least 6 characters.");return}
 try{
  const {data,error}=await supabaseClient.auth.signUp({email,password,options:{data:{username,full_name:name}}});
  if(error)throw error;
  if(data?.session&&data?.user){currentUser=data.user;await ensureProfile();await enterApp()}else msg("authMsg","Account created. Confirm your email, then login.",true);
 }catch(e){msg("authMsg","Registration failed: "+e.message)}
}

async function enterApp(){$("auth").classList.add("hidden");$("app").classList.remove("hidden");$("homeName").textContent=currentUser.email||"Gitalk User";show("home");try{await ensureProfile()}catch(e){console.error(e)}if(currentProfile)$("homeName").textContent=currentProfile.full_name||currentProfile.username||currentUser.email}

async function ensureProfile(){
 if(!currentUser)return;
 const r=await supabaseClient.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
 if(r.error){console.error(r.error);return}
 let p=r.data;
 if(!p){
  let base=(currentUser.user_metadata?.username||currentUser.email.split("@")[0]).toLowerCase().replace(/[^a-z0-9_]/g,"").slice(0,25)||"user";
  let username=base;
  const x=await supabaseClient.from("profiles").select("id").eq("username",username).limit(1);
  if(x.data?.length)username=base+"_"+currentUser.id.slice(0,5);
  const y=await supabaseClient.from("profiles").insert({id:currentUser.id,username,full_name:currentUser.user_metadata?.full_name||base}).select().single();
  if(!y.error)p=y.data;
 }
 currentProfile=p||null;
 if(p){$("profileName").value=p.full_name||"";$("profileUsername").value=p.username||"";$("profileBio").value=p.bio||""}
}

async function saveProfile(){
 const username=$("profileUsername").value.trim().toLowerCase(),name=$("profileName").value.trim(),bio=$("profileBio").value.trim();
 if(!username){msg("profileMsg","Username is required.");return}
 const {error}=await supabaseClient.from("profiles").upsert({id:currentUser.id,username,full_name:name,bio});
 if(error){msg("profileMsg",error.message);return}await ensureProfile();$("homeName").textContent=currentProfile?.full_name||currentProfile?.username||"Friend";msg("profileMsg","Profile saved ❤️",true)
}

async function searchUsers(){
 const q=$("searchInput").value.trim().replace(/[%_,]/g,"");if(!q){$("searchResults").innerHTML='<div class="msg">Enter a name or username.</div>';return}
 const {data,error}=await supabaseClient.from("profiles").select("id,username,full_name").neq("id",currentUser.id).or("username.ilike.%"+q+"%,full_name.ilike.%"+q+"%").limit(20);
 if(error){$("searchResults").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
 $("searchResults").innerHTML=data?.length?data.map(u=>'<div class="row"><div class="userinfo"><div class="avatar">'+esc((u.full_name||u.username||"?")[0].toUpperCase())+'</div><div><b>'+esc(u.full_name||u.username)+'</b><br><span class="small">@'+esc(u.username)+'</span></div></div><button class="primary" onclick="addFriend(\''+u.id+'\')">Add Friend</button></div>').join(""):'<div class="msg">No users found.</div>'
}

async function addFriend(id){
 const {data:old}=await supabaseClient.from("friendships").select("*").or("and(requester_id.eq."+currentUser.id+",addressee_id.eq."+id+"),and(requester_id.eq."+id+",addressee_id.eq."+currentUser.id+")");
 if(old?.length){alert("Friend request/friendship already exists.");return}
 const {error}=await supabaseClient.from("friendships").insert({requester_id:currentUser.id,addressee_id:id,status:"pending"});
 if(error)alert(error.message);else{alert("Friend request sent ❤️");loadFriends()}
}

async function loadFriends(){
 const {data,error}=await supabaseClient.from("friendships").select("*").or("requester_id.eq."+currentUser.id+",addressee_id.eq."+currentUser.id);
 if(error){$("friendsList").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
 const pending=(data||[]).filter(x=>x.status==="pending"&&x.addressee_id===currentUser.id),accepted=(data||[]).filter(x=>x.status==="accepted");
 $("requests").innerHTML=pending.length?pending.map(x=>'<div class="row"><div class="userinfo">Friend request</div><button class="primary" onclick="acceptFriend('+x.id+')">Accept</button></div>').join(""):'<div class="msg">No pending requests.</div>';
 const ids=accepted.map(x=>x.requester_id===currentUser.id?x.addressee_id:x.requester_id);
 if(!ids.length){$("friendsList").innerHTML='<div class="msg">No friends yet.</div>';return}
 const {data:users}=await supabaseClient.from("profiles").select("id,username,full_name").in("id",ids);
 $("friendsList").innerHTML=(users||[]).map(u=>'<div class="row"><div class="userinfo"><div class="avatar">'+esc((u.full_name||u.username||"?")[0].toUpperCase())+'</div><div><b>'+esc(u.full_name||u.username)+'</b><br><span class="small">@'+esc(u.username)+'</span></div></div><button class="primary" onclick="openChat(\''+u.id+'\',\''+esc(u.full_name||u.username)+'\')">💬 Chat</button></div>').join("")
}
async function acceptFriend(id){const {error}=await supabaseClient.from("friendships").update({status:"accepted",updated_at:new Date().toISOString()}).eq("id",id);if(error)alert(error.message);else loadFriends()}

async function openChat(id,name){
 chatUser=id;$("chatName").textContent=name;show("chat");await loadMessages();
 if(chatChannel)await supabaseClient.removeChannel(chatChannel);
 chatChannel=supabaseClient.channel("gitalk-chat-"+currentUser.id+"-"+id).on("postgres_changes",{event:"*",schema:"public",table:"messages"},()=>loadMessages()).subscribe()
}
async function loadMessages(){
 if(!chatUser)return;
 const {data,error}=await supabaseClient.from("messages").select("*").or("and(sender_id.eq."+currentUser.id+",receiver_id.eq."+chatUser+"),and(sender_id.eq."+chatUser+",receiver_id.eq."+currentUser.id+")").order("created_at",{ascending:true});
 if(error){$("chatBox").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
 $("chatBox").innerHTML=(data||[]).map(m=>'<div class="bubble '+(m.sender_id===currentUser.id?"mine":"theirs")+'">'+esc(m.message||"")+(m.image_url?'<br><a href="'+esc(m.image_url)+'" target="_blank">📎 Media</a>':"")+'</div>').join("");$("chatBox").scrollTop=$("chatBox").scrollHeight
}
async function sendMessage(){
 const text=$("messageInput").value.trim(),file=$("mediaInput").files[0];if(!text&&!file)return;
 let url=null;
 if(file){const path=currentUser.id+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const u=await supabaseClient.storage.from("chat-media").upload(path,file);if(u.error){alert(u.error.message);return}url=supabaseClient.storage.from("chat-media").getPublicUrl(path).data.publicUrl}
 const {error}=await supabaseClient.from("messages").insert({sender_id:currentUser.id,receiver_id:chatUser,message:text||null,image_url:url});
 if(error)alert(error.message);else{$("messageInput").value="";$("mediaInput").value="";loadMessages()}
}

async function createPost(){
 const content=$("postText").value.trim(),file=$("postMedia").files[0];if(!content&&!file)return alert("Write something or select a file.");
 let url=null,type=null;
 if(file){const path=currentUser.id+"/"+Date.now()+"_"+file.name.replace(/[^a-zA-Z0-9._-]/g,"_");const u=await supabaseClient.storage.from("post-media").upload(path,file);if(u.error){alert(u.error.message);return}url=supabaseClient.storage.from("post-media").getPublicUrl(path).data.publicUrl;type=file.type.startsWith("video/")?"video":"image"}
 const {error}=await supabaseClient.from("posts").insert({user_id:currentUser.id,content,media_url:url,media_type:type});if(error)alert(error.message);else{$("postText").value="";$("postMedia").value="";loadPosts()}
}
async function loadPosts(){
 const {data,error}=await supabaseClient.from("posts").select("*,profiles(username,full_name)").order("created_at",{ascending:false}).limit(50);
 if(error){$("postsFeed").innerHTML='<div class="msg err">'+esc(error.message)+'</div>';return}
 $("postsFeed").innerHTML=(data||[]).map(p=>'<div class="post"><b>'+esc(p.profiles?.full_name||p.profiles?.username||"Gitalk User")+'</b><div class="small">@'+esc(p.profiles?.username||"user")+' · '+new Date(p.created_at).toLocaleString()+'</div>'+(p.content?'<p style="white-space:pre-wrap">'+esc(p.content)+'</p>':"")+(p.media_url?(p.media_type==="video"?'<video class="post-media" controls src="'+esc(p.media_url)+'"></video>':'<img class="post-media" src="'+esc(p.media_url)+'">'):"")+'<div class="actions"><button class="light" onclick="likePost('+p.id+')">❤️ Like</button><button class="light" onclick="commentPost('+p.id+')">💬 Comment</button>'+(p.user_id===currentUser.id?'<button class="light" onclick="deletePost('+p.id+')">🗑 Delete</button>':"")+'</div></div>').join("")||'<div class="msg">No posts yet.</div>'
}
async function likePost(id){const {data}=await supabaseClient.from("post_likes").select("id").eq("post_id",id).eq("user_id",currentUser.id).maybeSingle();if(data)await supabaseClient.from("post_likes").delete().eq("id",data.id);else await supabaseClient.from("post_likes").insert({post_id:id,user_id:currentUser.id});loadPosts()}
async function commentPost(id){const text=prompt("Write comment:");if(!text?.trim())return;const {error}=await supabaseClient.from("post_comments").insert({post_id:id,user_id:currentUser.id,comment:text.trim()});if(error)alert(error.message);else loadPosts()}
async function deletePost(id){if(!confirm("Delete this post?"))return;const {error}=await supabaseClient.from("posts").delete().eq("id",id).eq("user_id",currentUser.id);if(error)alert(error.message);else loadPosts()}

async function loadNotifications(){
 const {data,error}=await supabaseClient.from("notifications").select("*").eq("user_id",currentUser.id).order("created_at",{ascending:false}).limit(50);if(error){console.error(error);return}
 $("notifBadge").textContent=(data||[]).filter(x=>!x.is_read).length||"";
 $("notificationsList").innerHTML=(data||[]).map(n=>'<div class="notif '+(n.is_read?"":"unread")+'">'+esc(n.message||"Notification")+'<div class="small">'+new Date(n.created_at).toLocaleString()+'</div></div>').join("")||'<div class="msg">No notifications.</div>'
}
async function markNotificationsRead(){const {error}=await supabaseClient.from("notifications").update({is_read:true}).eq("user_id",currentUser.id).eq("is_read",false);if(error)alert(error.message);else loadNotifications()}
async function logout(){if(chatChannel)await supabaseClient.removeChannel(chatChannel);await supabaseClient.auth.signOut();currentUser=null;currentProfile=null;chatUser=null;$("app").classList.add("hidden");$("auth").classList.remove("hidden");show("home")}

(async function(){try{const {data}=await supabaseClient.auth.getSession();if(data?.session?.user){currentUser=data.session.user;await enterApp()}}catch(e){console.error(e)}})();
</script>
</body>
</html>
