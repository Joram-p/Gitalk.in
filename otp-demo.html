<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gitalk OTP Style</title><style>
:root{--n-bg:#f3f7ff;--n-text:#15264b;--n-muted:#7181a3;--n-blue:#2d7ff9;--n-cyan:#20d5ee;--n-violet:#8b6cff}
body{background:radial-gradient(circle at 8% 8%,rgba(70,190,255,.24),transparent 25%),radial-gradient(circle at 92% 18%,rgba(139,108,255,.18),transparent 28%),linear-gradient(135deg,#fff,#f1f6ff 52%,#edf5ff)!important;color:var(--n-text)!important}
header,.navbar,.nav,.topbar,.site-header{background:rgba(255,255,255,.68)!important;backdrop-filter:blur(24px)!important;box-shadow:0 10px 30px rgba(70,91,130,.07)!important}
.card,.panel,.box,.service-card,.category-card,.news-card,.social-card,.auth-card,.modal-content,.feature-card{background:linear-gradient(145deg,rgba(255,255,255,.93),rgba(237,244,255,.8))!important;border:1px solid rgba(255,255,255,.9)!important;border-radius:28px!important;box-shadow:18px 18px 42px rgba(72,93,135,.18),-14px -14px 34px rgba(255,255,255,.98),inset 1px 1px 0 #fff!important}
input,select,textarea{border:1px solid #fff!important;border-radius:18px!important;background:#f1f6ff!important;box-shadow:inset 6px 6px 14px rgba(83,105,145,.1),inset -6px -6px 14px #fff!important;min-height:52px}
button,.btn,.button{border-radius:18px!important;background:linear-gradient(100deg,#bff5ff,#b8d9ff 48%,#cbbcff)!important;color:#19315f!important;font-weight:800!important;border:1px solid #fff!important;box-shadow:10px 10px 24px rgba(72,93,135,.18),-8px -8px 20px #fff!important}
button:hover,.btn:hover,.button:hover{transform:translateY(-2px)!important}
h1,h2,h3,h4{color:var(--n-text)}
a{color:#256eea}

body{min-height:100vh;display:grid;place-items:center}.otp{width:min(680px,calc(100% - 28px));padding:42px 28px;text-align:center;border-radius:34px;background:rgba(255,255,255,.86);box-shadow:24px 26px 60px rgba(68,88,126,.18),-18px -18px 50px #fff;border:1px solid #fff}.lock{width:92px;height:92px;margin:auto auto 22px;border-radius:50%;display:grid;place-items:center;font-size:42px;background:#f2f6ff;box-shadow:12px 12px 25px rgba(72,93,135,.17),-10px -10px 24px #fff}.otp h1{font-size:clamp(30px,6vw,50px);margin:8px}.sub{color:#7181a3;font-size:18px}.boxes{display:flex;gap:12px;justify-content:center;margin:30px 0;flex-wrap:wrap}.boxx{width:62px;height:70px;border-radius:18px;display:grid;place-items:center;background:#f1f6ff;box-shadow:inset 7px 7px 15px rgba(83,105,145,.1),inset -7px -7px 15px #fff;font-size:28px;font-weight:800}.active{color:#2376e8;box-shadow:0 0 0 3px rgba(32,213,238,.13),inset 7px 7px 15px rgba(83,105,145,.08),inset -7px -7px 15px #fff}.verify{width:100%;font-size:18px}.resend{margin-top:22px;color:#7181a3}.resend b{color:#287cf1}@media(max-width:600px){.otp{padding:30px 16px}.boxx{width:48px;height:58px}}</style></head><body><main class="otp"><div class="lock">🔐</div><h1>Verify Your OTP</h1><p class="sub">We've sent a 6-digit verification code to<br><b>+91 XXXXX 00945</b></p><div class="boxes"><div class="boxx active">2</div><div class="boxx">3</div><div class="boxx active"></div><div class="boxx"></div><div class="boxx"></div><div class="boxx"></div></div><button class="verify">VERIFY OTP　→</button><div class="resend">Resend OTP in <b>27</b> seconds</div></main></body></html>
