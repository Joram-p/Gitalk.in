<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gitalk Login</title><style>
.auth-wrap{min-height:70vh;display:grid;place-items:center;padding:40px 16px}.auth-card{width:min(460px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:28px;padding:30px;box-shadow:0 20px 60px #00000018}.auth-card h1{margin:0 0 8px}.auth-card p{color:#64748b}.auth-card label{display:block;margin:16px 0 7px;font-weight:700}.auth-card input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dbe3ef;border-radius:14px;font-size:16px}.auth-card button{width:100%;margin-top:20px;padding:14px;border:0;border-radius:14px;font-weight:800;font-size:16px;background:linear-gradient(90deg,#16a34a,#2563eb,#9333ea);color:#fff;cursor:pointer}.auth-note{font-size:13px;background:#f8fafc;border-radius:14px;padding:12px;margin-top:16px}.auth-links{text-align:center;margin-top:18px}.auth-links a{font-weight:800}#msg{margin-top:14px;font-weight:700}
</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script></head><body><div class="auth-wrap"><div class="auth-card"><h1>🔐 Login to Gitalk</h1><p>Secure email/password login</p><form id="f"><label>Email</label><input id="e" type="email" required><label>Password</label><input id="p" type="password" required minlength="6"><button>Login</button></form><button id="r" type="button">Forgot password?</button><div id="msg"></div><div class="auth-links"><a href="register.html">Create account</a> · <a href="index.html">Home</a></div></div></div><script>
const sb=supabase.createClient(GITALK_SUPABASE_URL,GITALK_SUPABASE_PUBLISHABLE_KEY),m=document.getElementById('msg');
f.onsubmit=async x=>{x.preventDefault();const {error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});m.textContent=error?error.message:'Login successful';if(!error)location.href='profile.html'};
r.onclick=async()=>{if(!e.value){m.textContent='Enter your email first.';return}const {error}=await sb.auth.resetPasswordForEmail(e.value.trim(),{redirectTo:location.origin+location.pathname.replace('login.html','reset-password.html')});m.textContent=error?error.message:'Password reset email sent.'};
</script></body></html>
