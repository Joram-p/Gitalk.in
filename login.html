<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Gitalk</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <main class="auth-container">
    <a href="index.html" class="brand">Gitalk<span>.</span></a>

    <section class="auth-card">
      <div class="auth-icon">💬</div>
      <h1>Welcome Back!</h1>
      <p class="subtitle">Login to continue your conversations.</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
               autocomplete="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password"
               autocomplete="current-password" required minlength="6">

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" id="remember"> Remember me
          </label>
          <a href="#" id="forgotPassword">Forgot password?</a>
        </div>

        <button type="submit" class="auth-button" id="loginButton">
          Login
        </button>

        <p id="authMessage" class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="switch-page">
        Don't have an account?
        <a href="register.html">Create Account</a>
      </p>
    </section>

    <p class="auth-footer">Gitalk — where people connect through conversation.</p>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
