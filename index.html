<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitalk Social</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- LOGIN -->
  <section id="loginPage" class="auth-page">
    <div class="auth-box">
      <div class="logo">Gitalk<span>.in</span></div>
      <h2>Welcome Back ❤️</h2>
      <p>Login to Gitalk Social</p>

      <input id="loginEmail" type="email" placeholder="Email">
      <input id="loginPassword" type="password" placeholder="Password">

      <button onclick="login()">Login</button>

      <p class="switch">
        Don't have an account?
        <a onclick="showRegister()">Create Account</a>
      </p>

      <p id="loginMessage" class="message"></p>
    </div>
  </section>


  <!-- REGISTER -->
  <section id="registerPage" class="auth-page hidden">
    <div class="auth-box">
      <div class="logo">Gitalk<span>.in</span></div>
      <h2>Create Account</h2>
      <p>Join Gitalk Social</p>

      <input id="registerName" type="text" placeholder="Your Name">
      <input id="registerEmail" type="email" placeholder="Email">
      <input id="registerPassword" type="password" placeholder="Password">

      <button onclick="register()">Create Account</button>

      <p class="switch">
        Already have an account?
        <a onclick="showLogin()">Login</a>
      </p>

      <p id="registerMessage" class="message"></p>
    </div>
  </section>


  <!-- SOCIAL PAGE -->
  <section id="socialPage" class="hidden">

    <header class="topbar">
      <div class="brand">Gitalk<span>.in</span></div>

      <div class="top-actions">
        <button onclick="showProfile()">👤</button>
        <button onclick="logout()">Logout</button>
      </div>
    </header>


    <main class="container">

      <!-- USER -->
      <div class="welcome-card">
        <div id="userAvatar" class="avatar">G</div>
        <div>
          <strong id="welcomeName">User</strong>
          <small id="welcomeEmail"></small>
        </div>
      </div>


      <!-- CREATE POST -->
      <div class="create-post">

        <textarea id="postText"
          placeholder="What's on your mind?"></textarea>

        <div class="post-tools">

          <label class="photo-btn">
            📷 Photo
            <input
              id="postImage"
              type="file"
              accept="image/*"
              onchange="previewImage(event)">
          </label>

          <button onclick="createPost()">Post 🚀</button>
        </div>

        <div id="imagePreview"></div>

      </div>


      <!-- FEED -->
      <h2 class="feed-title">Social Feed</h2>

      <div id="posts"></div>

    </main>


    <!-- PROFILE -->
    <div id="profileModal" class="modal hidden">

      <div class="modal-box">

        <button class="close" onclick="closeProfile()">✕</button>

        <div id="profileAvatar" class="big-avatar">G</div>

        <h2 id="profileName">User</h2>
        <p id="profileEmail"></p>

        <button onclick="closeProfile()">Close</button>

      </div>

    </div>

  </section>

</div>

<script src="script.js"></script>

</body>
</html>
