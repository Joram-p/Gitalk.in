<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gitalk Social</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="topbar">
    <div class="logo">Gitalk<span>.Social</span></div>

    <div class="top-icons">
        <button onclick="showMessage('Search')">🔍</button>
        <button onclick="showMessage('Notifications')">🔔</button>
    </div>
</header>

<main>

    <section class="profile-card">
        <div class="cover"></div>

        <div class="profile-info">
            <div class="avatar">G</div>

            <div>
                <h2>Gitalk User</h2>
                <p>@gitalkuser</p>
            </div>

            <button class="edit-btn" onclick="showMessage('Edit Profile')">
                Edit
            </button>
        </div>
    </section>


    <section class="create-post">

        <div class="post-user">
            <div class="small-avatar">G</div>

            <input
                type="text"
                id="postText"
                placeholder="What's on your mind?"
            >
        </div>

        <div class="post-actions">

            <button onclick="addPhoto()">📷 Photo</button>

            <button onclick="addVideo()">🎥 Video</button>

            <button onclick="createPost()">➕ Post</button>

        </div>

    </section>


    <section id="feed">

        <article class="post">

            <div class="post-header">

                <div class="small-avatar">G</div>

                <div>
                    <strong>Gitalk User</strong>
                    <p>Just now</p>
                </div>

            </div>

            <p class="post-text">
                Welcome to Gitalk Social! 💜
                A new place to connect, share and discover.
            </p>

            <div class="post-image">
                🌍
                <span>Welcome to Gitalk</span>
            </div>

            <div class="post-stats">
                <span id="likeCount">0 Likes</span>
                <span>0 Comments</span>
            </div>

            <div class="post-buttons">

                <button onclick="likePost()">❤️ Like</button>

                <button onclick="commentPost()">💬 Comment</button>

                <button onclick="sharePost()">↗️ Share</button>

            </div>

        </article>

    </section>

</main>


<nav class="bottom-nav">

    <button onclick="goHome()">
        🏠
        <span>Home</span>
    </button>

    <button onclick="showMessage('Friends')">
        👥
        <span>Friends</span>
    </button>

    <button onclick="showMessage('Create')">
        ➕
        <span>Create</span>
    </button>

    <button onclick="showMessage('Messages')">
        💬
        <span>Chat</span>
    </button>

    <button onclick="showMessage('Profile')">
        👤
        <span>Profile</span>
    </button>

</nav>

  };

</script>
<script src="script.js"></script>

</body>
</html>
