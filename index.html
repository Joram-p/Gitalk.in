<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Gitalk Social</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f5f7;
  color:#222;
}


/* AUTH */

#authPage{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

.authBox{
  width:100%;
  max-width:400px;
  background:white;
  padding:30px;
  border-radius:20px;
  box-shadow:0 5px 25px #0002;
}

.logo{
  text-align:center;
  font-size:32px;
  font-weight:bold;
  color:#ff2d55;
  margin-bottom:8px;
}

.subtitle{
  text-align:center;
  color:#777;
  margin-bottom:25px;
}

.authBox input{
  width:100%;
  padding:13px;
  margin-bottom:12px;
  border:1px solid #ddd;
  border-radius:10px;
  outline:none;
}

.mainBtn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:25px;
  background:#ff2d55;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.switchText{
  text-align:center;
  margin-top:18px;
  color:#777;
}

.switchText button{
  border:0;
  background:none;
  color:#ff2d55;
  font-weight:bold;
  cursor:pointer;
}


/* APP */

#appPage{
  display:none;
  padding-bottom:80px;
}

header{
  height:65px;
  background:white;
  position:sticky;
  top:0;
  z-index:10;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  box-shadow:0 2px 10px #0001;
}

.headerLogo{
  color:#ff2d55;
  font-size:25px;
  font-weight:bold;
}

.container{
  max-width:700px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px #0001;
}

.profile{
  text-align:center;
}

.profile img{
  width:100px;
  height:100px;
  object-fit:cover;
  border-radius:50%;
  border:4px solid #ff2d55;
}

.profile h2{
  margin-top:10px;
}

.profile p{
  color:#777;
  margin-top:5px;
}

.actionBtn{
  border:0;
  padding:10px 18px;
  margin:12px 4px 0;
  border-radius:22px;
  background:#ff2d55;
  color:white;
  cursor:pointer;
}

input,textarea{
  width:100%;
  padding:12px;
  margin:6px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
}

textarea{
  min-height:90px;
  resize:none;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

.bottomNav{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:65px;
  background:white;
  display:flex;
  justify-content:space-around;
  align-items:center;
  box-shadow:0 -2px 10px #0002;
  z-index:20;
}

.bottomNav button{
  border:0;
  background:none;
  cursor:pointer;
  font-size:13px;
}

.logout{
  background:#333;
  color:white;
  border:0;
  padding:9px 14px;
  border-radius:20px;
  cursor:pointer;
}

</style>

</head>


<body>


<!-- ================= AUTH ================= -->

<div id="authPage">

<div class="authBox">

<div class="logo">
Gitalk.in
</div>

<div class="subtitle">
Connect • Share • Enjoy ❤️
</div>


<!-- LOGIN -->

<div id="loginBox">

<h2 style="margin-bottom:15px;">
Login
</h2>

<input
id="loginEmail"
type="email"
placeholder="Email"
>

<input
id="loginPassword"
type="password"
placeholder="Password"
>

<button
class="mainBtn"
onclick="login()">
🔐 Login
</button>

<div class="switchText">

Don't have an account?

<button onclick="showSignup()">
Create Account
</button>

</div>

</div>


<!-- SIGNUP -->

<div id="signupBox"
style="display:none;">

<h2 style="margin-bottom:15px;">
Create Account
</h2>

<input
id="signupName"
type="text"
placeholder="Your Name"
>

<input
id="signupEmail"
type="email"
placeholder="Email"
>

<input
id="signupPassword"
type="password"
placeholder="Password (6+ characters)"
>

<button
class="mainBtn"
onclick="signup()">
❤️ Create Account
</button>

<div class="switchText">

Already have an account?

<button onclick="showLogin()">
Login
</button>

</div>

</div>

</div>

</div>



<!-- ================= APP ================= -->

<div id="appPage">


<header>

<div class="headerLogo">
Gitalk.in
</div>

<div>

<span id="userEmail"
style="font-size:12px;color:#777;">
</span>

<button
class="logout"
onclick="logout()">
Logout
</button>

</div>

</header>


<div class="container">


<!-- HOME -->

<section
id="home"
class="page active">

<div class="card profile">

<img
id="homePhoto"
src="https://via.placeholder.com/150"
>

<h2 id="profileName">
Gitalk User
</h2>

<p id="profileUsername">
</p>

<p id="profileBio">
Welcome to Gitalk Social ❤️
</p>

<button
class="actionBtn"
onclick="showPage('profile')">
👤 My Profile
</button>

<button
class="actionBtn"
onclick="showPage('edit')">
✏️ Edit
</button>

</div>

<div class="card">

<h3>📝 Create Post</h3>

<br>

<textarea
placeholder="What's on your mind?"
></textarea>

<button
class="actionBtn"
onclick="alert('Post system will be connected with Firebase next ❤️')">
Post
</button>

</div>

</section>



<!-- PROFILE -->

<section
id="profile"
class="page">

<div class="card profile">

<img
id="profilePhoto"
src="https://via.placeholder.com/150"
>

<h2 id="profileName">
Gitalk User
</h2>

<p id="profileUsername">
</p>

<p id="profileBio">
</p>

<p id="profileLocation">
📍 India
</p>

<p id="profileWebsite">
</p>

<button
class="actionBtn"
onclick="showPage('edit')">
✏️ Edit Profile
</button>

</div>

</section>



<!-- EDIT PROFILE -->

<section id="edit" class="page">

  <div class="card">

    <h2>✏️ Edit Profile</h2>

    <!-- PROFILE PHOTO -->

    <div style="text-align:center;margin:20px 0;">

      <img
        id="editProfilePhoto"
        src="https://via.placeholder.com/150"
        style="
          width:120px;
          height:120px;
          border-radius:50%;
          object-fit:cover;
          border:4px solid #ff2d55;
        "
      >

      <br><br>

      <label
        for="profileImageInput"
        style="
          display:inline-block;
          background:#ff2d55;
          color:white;
          padding:12px 20px;
          border-radius:25px;
          cursor:pointer;
          font-weight:bold;
        "
      >
        📷 Upload Profile Photo
      </label>

      <input
        id="profileImageInput"
        type="file"
        accept="image/*"
        style="display:none;"
        onchange="previewProfileImage(event)"
      >

      <p
        id="uploadStatus"
        style="
          margin-top:10px;
          color:#777;
          font-size:13px;
        "
      ></p>

    </div>


    <!-- NAME -->

    <label>Name</label>

    <input
      id="nameInput"
      type="text"
      placeholder="Your name"
    >


    <!-- USERNAME -->

    <label>Username</label>

    <input
      id="usernameInput"
      type="text"
      placeholder="@username"
    >


    <!-- BIO -->

    <label>Bio</label>

    <textarea
      id="bioInput"
      placeholder="About you">
    </textarea>


    <!-- LOCATION -->

    <label>Location</label>

    <input
      id="locationInput"
      type="text"
      placeholder="City / Country"
    >


    <!-- WEBSITE -->

    <label>Website</label>

    <input
      id="websiteInput"
      type="url"
      placeholder="https://example.com"
    >


    <!-- SAVE -->

    <button
      class="mainBtn"
      onclick="saveFirebaseProfile()"
    >
      💾 Save Profile
    </button>

  </div>

</section>

<div class="card">

<h2>✏️ Edit Profile</h2>

<br>

<label>Name</label>

<input
id="nameInput"
type="text"
placeholder="Your name"
>


<label>Username</label>

<input
id="usernameInput"
type="text"
placeholder="@username"
>


<label>Bio</label>

<textarea
id="bioInput"
placeholder="About you">
</textarea>


<label>Location</label>

<input
id="locationInput"
type="text"
placeholder="City / Country"
>


<label>Website</label>

<input
id="websiteInput"
type="url"
placeholder="https://example.com"
>


<button
class="mainBtn"
onclick="saveFirebaseProfile()">
💾 Save Profile
</button>

</div>

</section>



<!-- SETTINGS -->

<section
id="settings"
class="page">

<div class="card">

<h2>⚙️ Social Settings</h2>

<br>

<label>
🔔 Notifications
</label>

<br><br>

<input
type="checkbox"
checked
style="width:auto;"
>

<hr>

<br>

<label>
🔒 Private Account
</label>

<br><br>

<input
type="checkbox"
style="width:auto;"
>

<hr>

<br>

<label>
🌙 Dark Mode
</label>

<br><br>

<input
type="checkbox"
style="width:auto;"
onchange="toggleDark()"
>

</div>

</section>

</div>


<!-- BOTTOM NAV -->

<nav class="bottomNav">

<button onclick="showPage('home')">
🏠<br>Home
</button>

<button onclick="showPage('home')">
➕<br>Create
</button>

<button onclick="showPage('profile')">
👤<br>Profile
</button>

<button onclick="showPage('settings')">
⚙️<br>Settings
</button>

</nav>

</div>



<script>

function showPage(id){

document
.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

document
.getElementById(id)
.classList.add("active");

window.scrollTo(0,0);

}


function toggleDark(){

document.body.classList.toggle("dark");

if(document.body.classList.contains("dark")){

document.body.style.background="#111";
document.body.style.color="white";

document
.querySelectorAll(".card,.authBox,header,.bottomNav")
.forEach(el=>{
el.style.background="#1e1e1e";
el.style.color="white";
});

}else{

location.reload();

}

}

</script>


<script
type="module"
src="./script.js">
</script>


</body>
</html>
