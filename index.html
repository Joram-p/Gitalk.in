<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Gitalk Social</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#087cf5,#08b8b0,#00c853);
  min-height:100vh;
  color:#222;
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}

.card{
  width:100%;
  max-width:620px;
  background:#fff;
  border-radius:28px;
  padding:35px;
  box-shadow:0 15px 45px #0004;
}

.logo{
  text-align:center;
  font-size:52px;
  font-weight:700;
  color:#087bea;
  margin:5px 0;
}

.tag{
  text-align:center;
  color:#666;
  font-size:21px;
  margin-bottom:30px;
}

h2{
  text-align:center;
  font-size:30px;
  margin:10px 0 25px;
}

input{
  width:100%;
  padding:17px 18px;
  border:1px solid #ccc;
  border-radius:14px;
  font-size:17px;
  margin:7px 0;
  outline:none;
}

input:focus{
  border-color:#087bea;
  box-shadow:0 0 0 3px #087bea22;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:16px;
  font-size:18px;
  font-weight:700;
  cursor:pointer;
  margin-top:10px;
  background:#087cf5;
  color:#fff;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.hidden{
  display:none!important;
}

.msg{
  text-align:center;
  margin:15px 0;
  padding:12px;
  border-radius:10px;
  display:none;
  line-height:1.5;
}

.ok{
  background:#e8fff0;
  color:#087a35;
}

.err{
  background:#ffe9e9;
  color:#b00020;
}

.link{
  color:#087bea;
  font-weight:700;
  cursor:pointer;
  text-align:center;
  margin-top:20px;
  font-size:18px;
}

.small{
  text-align:center;
  color:#666;
  margin-top:16px;
}

.home{
  display:none;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid #ddd;
  padding-bottom:15px;
  margin-bottom:20px;
}

.logo2{
  font-size:30px;
  font-weight:bold;
  color:#087bea;
}

.logout{
  width:auto;
  padding:10px 18px;
  margin:0;
  background:#222;
}

.profilebox{
  text-align:center;
  padding:25px;
  background:#f4f7fb;
  border-radius:18px;
}

.avatar{
  width:85px;
  height:85px;
  border-radius:50%;
  background:#087bea;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:auto;
  font-size:35px;
  font-weight:bold;
}

#userEmail{
  color:#666;
  margin-top:10px;
}

@media(max-width:500px){

  .wrap{
    padding:15px;
  }

  .card{
    padding:25px 18px;
    border-radius:22px;
  }

  .logo{
    font-size:45px;
  }

  .tag{
    font-size:18px;
  }

}
</style>
</head>

<body>

<div class="wrap">

<div class="card">

<!-- ================= LOGIN ================= -->

<section id="loginBox">

  <div class="logo">
    Gitalk
  </div>

  <div class="tag">
    Connect • Chat • Share
  </div>

  <h2>
    Login
  </h2>

  <div id="loginMsg" class="msg"></div>

  <input
    id="loginEmail"
    type="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    id="loginPassword"
    type="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    id="loginBtn"
    type="button"
  >
    Login
  </button>

  <div
    id="openRegister"
    class="link"
  >
    Create New Account
  </div>

</section>


<!-- ================= REGISTER ================= -->

<section
  id="registerBox"
  class="hidden"
>

  <div class="logo">
    Gitalk
  </div>

  <div class="tag">
    Create your social account
  </div>

  <h2>
    Create Account
  </h2>

  <div
    id="registerMsg"
    class="msg"
  ></div>

  <input
    id="fullName"
    type="text"
    placeholder="Full Name"
    autocomplete="name"
  >

  <input
    id="username"
    type="text"
    placeholder="Username"
    autocomplete="username"
  >

  <input
    id="registerEmail"
    type="email"
    placeholder="Email"
    autocomplete="email"
  >

  <input
    id="registerPassword"
    type="password"
    placeholder="Password (minimum 6 characters)"
    autocomplete="new-password"
  >

  <button
    id="registerBtn"
    type="button"
  >
    Create Account
  </button>

  <div
    id="backLogin"
    class="link"
  >
    ← Back to Login
  </div>

</section>


<!-- ================= HOME ================= -->

<section
  id="homeBox"
  class="home"
>

  <div class="top">

    <div class="logo2">
      Gitalk
    </div>

    <button
      id="logoutBtn"
      class="logout"
      type="button"
    >
      Logout
    </button>

  </div>


  <div class="profilebox">

    <div
      id="avatar"
      class="avatar"
    >
      G
    </div>

    <h2 id="welcomeName">
      Welcome
    </h2>

    <div id="userEmail"></div>

    <p id="welcomeUsername"></p>

  </div>


  <div class="small">
    Login successful! ❤️
  </div>

</section>

</div>

</div>


<script>

/* =====================================================
   SUPABASE CONFIG
===================================================== */

const SUPABASE_URL =
"https://mhnfutbpvyvhdmqqquyi.supabase.co";

const SUPABASE_KEY =
"sb_publishable_NpULKcoHIfa0urWJH0oOPA_o9vqamOl";


const sb =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =====================================================
   ELEMENTS
===================================================== */

const loginBox =
document.getElementById("loginBox");

const registerBox =
document.getElementById("registerBox");

const homeBox =
document.getElementById("homeBox");


/* =====================================================
   MESSAGE FUNCTION
===================================================== */

function showMsg(
  id,
  text,
  type
){

  const el =
  document.getElementById(id);

  el.textContent = text;

  el.className =
  "msg " + type;

  el.style.display =
  "block";
}


function hideMsg(id){

  const el =
  document.getElementById(id);

  el.style.display =
  "none";
}


/* =====================================================
   SHOW LOGIN
===================================================== */

function showLogin(){

  loginBox.classList.remove(
    "hidden"
  );

  registerBox.classList.add(
    "hidden"
  );

  homeBox.style.display =
  "none";

  hideMsg("registerMsg");
}


/* =====================================================
   SHOW REGISTER
===================================================== */

function showRegister(){

  loginBox.classList.add(
    "hidden"
  );

  registerBox.classList.remove(
    "hidden"
  );

  homeBox.style.display =
  "none";

  hideMsg("loginMsg");
}


/* =====================================================
   REGISTER PAGE BUTTON
===================================================== */

document
.getElementById("openRegister")
.addEventListener(
  "click",
  function(){

    showRegister();

  }
);


/* =====================================================
   BACK TO LOGIN
===================================================== */

document
.getElementById("backLogin")
.addEventListener(
  "click",
  function(){

    showLogin();

  }
);


/* =====================================================
   CREATE PROFILE
===================================================== */

async function ensureProfile(
  user,
  name="",
  username=""
){

  const result =
  await sb
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();


  if(result.error){

    throw result.error;

  }


  if(!result.data){

    let base =
    username ||
    (user.email || "user")
    .split("@")[0];


    base =
    base
    .toLowerCase()
    .replace(
      /[^a-z0-9_]/g,
      ""
    )
    .slice(0,30);


    if(!base){

      base =
      "user" +
      Math.floor(
        Math.random()*99999
      );

    }


    const {error} =
    await sb
    .from("profiles")
    .insert({

      id:user.id,

      username:base,

      full_name:
      name ||
      user.user_metadata?.full_name ||
      base

    });


    if(
      error &&
      !String(error.message)
      .toLowerCase()
      .includes("duplicate")
    ){

      throw error;

    }

  }

}


/* =====================================================
   OPEN HOME
===================================================== */

async function openHome(user){

  loginBox.classList.add(
    "hidden"
  );

  registerBox.classList.add(
    "hidden"
  );

  homeBox.style.display =
  "block";


  let profile =
  null;


  const result =
  await sb
  .from("profiles")
  .select("*")
  .eq("id",user.id)
  .maybeSingle();


  if(!result.error){

    profile =
    result.data;

  }


  const name =
  profile?.full_name ||
  user.user_metadata?.full_name ||
  "Gitalk User";


  const username =
  profile?.username
  ? "@" + profile.username
  : "";


  document
  .getElementById("welcomeName")
  .textContent =
  "Welcome, " + name;


  document
  .getElementById("welcomeUsername")
  .textContent =
  username;


  document
  .getElementById("userEmail")
  .textContent =
  user.email || "";


  document
  .getElementById("avatar")
  .textContent =
  (
    name.charAt(0) ||
    "G"
  ).toUpperCase();

}


/* =====================================================
   REGISTER
===================================================== */

document
.getElementById("registerBtn")
.addEventListener(
  "click",
  async function(){

    hideMsg("registerMsg");


    const fullName =
    document
    .getElementById("fullName")
    .value
    .trim();


    const username =
    document
    .getElementById("username")
    .value
    .trim()
    .toLowerCase();


    const email =
    document
    .getElementById("registerEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("registerPassword")
    .value;


    /* VALIDATION */

    if(
      !fullName ||
      !username ||
      !email ||
      !password
    ){

      showMsg(
        "registerMsg",
        "Please fill all fields.",
        "err"
      );

      return;

    }


    if(password.length < 6){

      showMsg(
        "registerMsg",
        "Password must be at least 6 characters.",
        "err"
      );

      return;

    }


    const btn =
    document.getElementById(
      "registerBtn"
    );


    btn.disabled =
    true;

    btn.textContent =
    "Creating Account...";


    try{

      const {data,error} =
      await sb.auth.signUp({

        email:email,

        password:password,

        options:{

          data:{

            full_name:
            fullName,

            username:
            username

          }

        }

      });


      if(error){

        throw error;

      }


      /* SESSION AVAILABLE */

      if(
        data.session &&
        data.user
      ){

        try{

          await ensureProfile(
            data.user,
            fullName,
            username
          );

        }
        catch(profileError){

          showMsg(
            "registerMsg",
            "Account created, but profile setup failed: " +
            profileError.message,
            "err"
          );

          return;

        }


        showMsg(
          "registerMsg",
          "Account created successfully! ❤️",
          "ok"
        );


        setTimeout(
          function(){

            openHome(
              data.user
            );

          },
          700
        );

      }

      /* EMAIL CONFIRMATION */

      else{

        showMsg(
          "registerMsg",
          "Account created! Please check your email and confirm your email address, then Login.",
          "ok"
        );

      }


    }
    catch(e){

      showMsg(
        "registerMsg",
        e.message ||
        "Registration failed.",
        "err"
      );

    }
    finally{

      btn.disabled =
      false;

      btn.textContent =
      "Create Account";

    }

  }
);


/* =====================================================
   LOGIN
===================================================== */

document
.getElementById("loginBtn")
.addEventListener(
  "click",
  async function(){

    hideMsg("loginMsg");


    const email =
    document
    .getElementById("loginEmail")
    .value
    .trim();


    const password =
    document
    .getElementById("loginPassword")
    .value;


    if(
      !email ||
      !password
    ){

      showMsg(
        "loginMsg",
        "Please enter email and password.",
        "err"
      );

      return;

    }


    const btn =
    document.getElementById(
      "loginBtn"
    );


    btn.disabled =
    true;

    btn.textContent =
    "Logging in...";


    try{

      const {data,error} =
      await sb.auth
      .signInWithPassword({

        email:email,

        password:password

      });


      if(error){

        throw error;

      }


      if(data.user){

        try{

          await ensureProfile(
            data.user
          );

        }
        catch(profileError){

          console.log(
            "Profile:",
            profileError
          );

        }


        await openHome(
          data.user
        );

      }

    }
    catch(e){

      showMsg(
        "loginMsg",
        e.message ||
        "Login failed.",
        "err"
      );

    }
    finally{

      btn.disabled =
      false;

      btn.textContent =
      "Login";

    }

  }
);


/* =====================================================
   LOGOUT
===================================================== */

document
.getElementById("logoutBtn")
.addEventListener(
  "click",
  async function(){

    await sb.auth.signOut();

    showLogin();

  }
);


/* =====================================================
   AUTH STATE
===================================================== */

sb.auth.onAuthStateChange(
  async function(
    event,
    session
  ){

    if(
      session?.user &&
      event === "SIGNED_IN"
    ){

      await openHome(
        session.user
      );

    }

  }
);


/* =====================================================
   CHECK EXISTING SESSION
===================================================== */

(async function(){

  const {data} =
  await sb.auth.getSession();


  if(data.session){

    await openHome(
      data.session.user
    );

  }

})();

</script>

</body>
</html>
