<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gitalk Social - Connect, Share & Enjoy</title>
  <meta name="description" content="Gitalk Social - Connect with friends, share photos, videos and posts.">
  <meta name="theme-color" content="#ff2d55">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial,Helvetica,sans-serif;
    }

    body{
      background:#f5f5f5;
      color:#222;
    }

    /* HEADER */
    header{
      position:sticky;
      top:0;
      z-index:1000;
      height:65px;
      background:#fff;
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 18px;
      box-shadow:0 2px 10px rgba(0,0,0,.12);
    }

    .logo{
      font-size:26px;
      font-weight:bold;
      color:#ff2d55;
    }

    .logo span{
      color:#222;
    }

    .header-buttons{
      display:flex;
      gap:8px;
    }

    .header-buttons button{
      border:0;
      background:#f1f1f1;
      padding:9px 13px;
      border-radius:20px;
      cursor:pointer;
      font-size:14px;
    }

    .header-buttons button:hover{
      background:#ff2d55;
      color:#fff;
    }

    /* MAIN */
    .container{
      max-width:700px;
      margin:auto;
      padding:15px;
    }

    /* PROFILE */
    .profile-card{
      background:#fff;
      border-radius:15px;
      padding:20px;
      text-align:center;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .profile-photo{
      width:85px;
      height:85px;
      border-radius:50%;
      object-fit:cover;
      border:4px solid #ff2d55;
      margin-bottom:8px;
    }

    .profile-card h2{
      font-size:21px;
    }

    .profile-card p{
      color:#777;
      margin-top:5px;
    }

    /* CREATE POST */
    .create-post{
      background:#fff;
      padding:15px;
      border-radius:15px;
      margin-bottom:15px;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .post-input{
      width:100%;
      min-height:80px;
      border:1px solid #ddd;
      border-radius:12px;
      padding:12px;
      resize:none;
      outline:none;
      font-size:15px;
    }

    .post-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-top:10px;
      gap:8px;
    }

    .upload-label{
      background:#f1f1f1;
      padding:10px 14px;
      border-radius:20px;
      cursor:pointer;
      font-size:14px;
    }

    .upload-label:hover{
      background:#ffe1e7;
    }

    #photoInput{
      display:none;
    }

    .post-btn{
      background:#ff2d55;
      color:white;
      border:0;
      padding:10px 20px;
      border-radius:20px;
      cursor:pointer;
      font-weight:bold;
    }

    .post-btn:hover{
      background:#e91e46;
    }

    #preview{
      display:none;
      width:100%;
      max-height:350px;
      object-fit:cover;
      border-radius:12px;
      margin-top:10px;
    }

    /* POST */
    .post{
      background:#fff;
      border-radius:15px;
      margin-bottom:15px;
      overflow:hidden;
      box-shadow:0 2px 8px rgba(0,0,0,.08);
    }

    .post-header{
      display:flex;
      align-items:center;
      padding:13px;
      gap:10px;
    }

    .post-avatar{
      width:42px;
      height:42px;
      border-radius:50%;
      object-fit:cover;
    }

    .post-user{
      font-weight:bold;
    }

    .post-time{
      display:block;
      font-size:12px;
      color:#888;
      margin-top:3px;
    }

    .post-content{
      padding:0 13px 13px;
      line-height:1.5;
    }

    .post-image{
      width:100%;
      max-height:500px;
      object-fit:cover;
      display:block;
    }

    .post-footer{
      display:flex;
      border-top:1px solid #eee;
      padding:5px;
    }

    .post-footer button{
      flex:1;
      border:0;
      background:white;
      padding:11px;
      cursor:pointer;
      border-radius:8px;
      font-size:14px;
    }

    .post-footer button:hover{
      background:#f5f5f5;
    }

    /* BOTTOM NAV */
    .bottom-nav{
      position:fixed;
      bottom:0;
      left:0;
      right:0;
      height:60px;
      background:#fff;
      display:flex;
      justify-content:space-around;
      align-items:center;
      box-shadow:0 -2px 10px rgba(0,0,0,.12);
      z-index:999;
    }

    .bottom-nav button{
      border:0;
      background:none;
      cursor:pointer;
      font-size:13px;
      color:#555;
    }

    .bottom-nav button:first-child{
      color:#ff2d55;
      font-weight:bold;
    }

    footer{
      text-align:center;
      padding:80px 10px 75px;
      color:#777;
      font-size:13px;
    }

    /* MOBILE */
    @media(max-width:600px){
      header{
        padding:0 12px;
      }

      .logo{
        font-size:22px;
      }

      .header-buttons button{
        padding:8px 10px;
      }

      .container{
        padding:10px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">
    Gitalk<span>.in</span>
  </div>

  <div class="header-buttons">
    <button onclick="searchPosts()">🔍 Search</button>
    <button onclick="loginUser()">👤 Login</button>
  </div>
</header>


<!-- MAIN -->
<main class="container">

  <!-- PROFILE -->
  <section class="profile-card">
    <img
      class="profile-photo"
      src="https://via.placeholder.com/150"
      alt="Gitalk Profile"
    >

    <h2>Welcome to Gitalk Social ❤️</h2>
    <p>Connect • Share • Enjoy</p>
  </section>


  <!-- CREATE POST -->
  <section class="create-post">

    <textarea
      id="postText"
      class="post-input"
      placeholder="What's on your mind?"
    ></textarea>

    <img id="preview" alt="Photo Preview">

    <div class="post-actions">

      <label for="photoInput" class="upload-label">
        📷 Photo / Video
      </label>

      <input
        type="file"
        id="photoInput"
        accept="image/*,video/*"
        onchange="previewFile(event)"
      >

      <button class="post-btn" onclick="createPost()">
        Post
      </button>

    </div>

  </section>


  <!-- POSTS -->
  <section id="posts">

    <!-- DEMO POST -->
    <article class="post">

      <div class="post-header">

        <img
          class="post-avatar"
          src="https://via.placeholder.com/100"
          alt="User"
        >

        <div>
          <div class="post-user">Gitalk User</div>
          <span class="post-time">Just now</span>
        </div>

      </div>

      <div class="post-content">
        Welcome to Gitalk Social! 🎉
        <br>
        Share your photos, videos and thoughts with everyone.
      </div>

      <div class="post-footer">
        <button onclick="likePost(this)">❤️ Like</button>
        <button onclick="commentPost()">💬 Comment</button>
        <button onclick="sharePost()">↗️ Share</button>
      </div>

    </article>

  </section>

</main>


<!-- FOOTER -->
<footer>
  © 2026 Gitalk.in — Gitalk Social
</footer>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="createFocus()">
    ➕<br>Create
  </button>

  <button onclick="showProfile()">
    👤<br>Profile
  </button>

  <button onclick="showSettings()">
    ⚙️<br>Settings
  </button>

</nav>


<script>

  /* PHOTO PREVIEW */
  function previewFile(event){

    const file = event.target.files[0];
    const preview = document.getElementById("preview");

    if(!file){
      preview.style.display = "none";
      return;
    }

    if(file.type.startsWith("image/")){

      const reader = new FileReader();

      reader.onload = function(e){
        preview.src = e.target.result;
        preview.style.display = "block";
      };

      reader.readAsDataURL(file);

    }else{

      preview.style.display = "none";

    }
  }


  /* CREATE POST */
  function createPost(){

    const text = document.getElementById("postText").value.trim();
    const file = document.getElementById("photoInput").files[0];

    if(!text && !file){
      alert("Please write something or select a photo.");
      return;
    }

    const posts = document.getElementById("posts");

    const post = document.createElement("article");
    post.className = "post";

    let mediaHTML = "";

    if(file && file.type.startsWith("image/")){

      const imageURL = URL.createObjectURL(file);

      mediaHTML =
        `<img class="post-image" src="${imageURL}" alt="Post Photo">`;

    }

    post.innerHTML = `

      <div class="post-header">

        <img
          class="post-avatar"
          src="https://via.placeholder.com/100"
          alt="User"
          class="post-avatar"
        >

        <div>
          <div class="post-user">You</div>
          <span class="post-time">Just now</span>
        </div>

      </div>

      <div class="post-content">
        ${escapeHTML(text)}
      </div>

      ${mediaHTML}

      <div class="post-footer">

        <button onclick="likePost(this)">
          ❤️ Like
        </button>

        <button onclick="commentPost()">
          💬 Comment
        </button>

        <button onclick="sharePost()">
          ↗️ Share
        </button>

      </div>
    `;

    posts.prepend(post);

    document.getElementById("postText").value = "";
    document.getElementById("photoInput").value = "";
    document.getElementById("preview").style.display = "none";

    alert("Post created successfully ❤️");
  }


  /* SECURITY */
  function escapeHTML(text){

    const div = document.createElement("div");
    div.textContent = text;
    return div.innerHTML;

  }


  /* LIKE */
  function likePost(button){

    if(button.innerText.includes("❤️")){
      button.innerText = "💖 Liked";
    }else{
      button.innerText = "❤️ Like";
    }

  }


  /* COMMENT */
  function commentPost(){

    const comment = prompt("Write your comment:");

    if(comment && comment.trim()){
      alert("Comment added ❤️");
    }

  }


  /* SHARE */
  function sharePost(){

    if(navigator.share){

      navigator.share({
        title:"Gitalk Social",
        text:"Check out Gitalk Social!",
        url:window.location.href
      });

    }else{

      navigator.clipboard.writeText(window.location.href);

      alert("Page link copied! Share it with your friends ❤️");

    }

  }


  /* SEARCH */
  function searchPosts(){

    const query = prompt("Search Gitalk posts:");

    if(query){
      alert("Search feature ready for Firebase integration.");
    }

  }


  /* LOGIN */
  function loginUser(){

    alert("Login / Signup will be connected with Firebase Authentication.");

  }


  /* NAVIGATION */
  function goHome(){

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  function createFocus(){

    document.getElementById("postText").focus();

    window.scrollTo({
      top:0,
      behavior:"smooth"
    });

  }


  function showProfile(){

    alert("Profile section will be connected with Firebase.");

  }


  function showSettings(){

    alert("Settings section will be added next.");

  }

</script>

</body>
  </html>
