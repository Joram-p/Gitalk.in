<!-- PROFILE SETTINGS -->
<div id="profileModal" class="modal hidden">

  <div class="modal-box profile-settings">

    <button id="closeProfile" class="close">✕</button>

    <div id="profileAvatar" class="big-avatar">G</div>

    <h2>Profile Settings</h2>

    <label class="profile-photo-label">
      📷 Change Profile Photo
      <input
        id="profilePhotoInput"
        type="file"
        accept="image/*">
    </label>

    <input
      id="profileNameInput"
      type="text"
      placeholder="Your Name">

    <textarea
      id="profileBioInput"
      placeholder="Write something about yourself..."></textarea>

    <button id="saveProfileBtn" class="save-profile">
      Save Profile ❤️
    </button>

    <p id="profileMsg"></p>

  </div>

</div>
