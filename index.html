<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#170c22">
<meta name="description" content="GITALK की ओर से दीपावली की हार्दिक शुभकामनाएँ।">
<title>GITALK ✨ शुभ दीपावली</title>
<style>
:root{--gold:#ffd779;--orange:#ff873d;--red:#c83b2b;--cream:#fff3d8;--ink:#fff8e9;--muted:#e5c9aa;--glass:rgba(49,20,37,.72);--line:rgba(255,216,132,.24)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#170c22;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(ellipse at 50% 12%,#682d36 0,transparent 44%),radial-gradient(circle at 10% 65%,#482044 0,transparent 28%),linear-gradient(145deg,#170c22,#27102b 52%,#100b1b)}
#sparkles{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#ffe6a0;box-shadow:0 0 12px #ffba4b;animation:twinkle 2s infinite alternate}@keyframes twinkle{to{opacity:.15;transform:scale(.3)}}
header,main,footer{position:relative;z-index:1}.top{position:sticky;top:0;z-index:20;background:#170c22d9;backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}nav{max-width:1150px;margin:auto;padding:12px 20px;display:flex;justify-content:space-between;align-items:center;gap:14px}.brand{display:flex;align-items:center;gap:10px;font-weight:950;letter-spacing:.1em}.logo{height:46px;width:46px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffe8a0,#f08b37,#cf3f39,#ffe8a0);padding:4px;animation:rotate 9s linear infinite;box-shadow:0 0 24px #ffb13b55}.logo span{height:100%;width:100%;border-radius:50%;display:grid;place-items:center;background:#31172c;border:1px solid #ffdf8c;font-size:21px;color:var(--gold);text-shadow:0 0 12px #ffbd4a}@keyframes rotate{to{transform:rotate(360deg)}}.brand small{display:block;font-size:9px;color:var(--gold);letter-spacing:.24em;margin-top:2px}
.links{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}.links button,.menu{border:1px solid transparent;color:#f9dfba;background:transparent;padding:9px 11px;border-radius:12px;font-weight:750;cursor:pointer}.links button:hover,.links button.active{border-color:var(--line);background:#ffcf7217;color:var(--gold)}.menu{display:none}
main{max-width:1150px;margin:auto;padding:25px 20px 65px}.page{animation:enter .4s ease}@keyframes enter{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{min-height:570px;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center}.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);border-radius:999px;background:#ffcf7210;color:var(--gold);font-size:12px;letter-spacing:.12em;font-weight:850}.hero h1{font-size:clamp(42px,6.5vw,78px);line-height:1.02;letter-spacing:-.045em;margin:19px 0}.shine{background:linear-gradient(100deg,#fff2b9,#ffb45b,#ffdf91,#ff805e);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{color:var(--muted);font-size:17px;line-height:1.85}.actions{display:flex;gap:11px;flex-wrap:wrap;margin-top:23px}.btn{border:1px solid var(--line);border-radius:14px;padding:13px 17px;font-weight:850;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-3px)}.gold{background:linear-gradient(120deg,#ffe7a0,#ffb74c,#ef733c);color:#3a1424;border:0;box-shadow:0 10px 28px #ff963a30}.outline{background:#ffffff08;color:var(--cream)}
.video-box{position:relative;border:1px solid #ffdc8b55;padding:8px;border-radius:30px;background:linear-gradient(135deg,#ffda7a55,#ffffff0a,#d9494c55);box-shadow:0 25px 70px #0008}.video-inner{position:relative;overflow:hidden;border-radius:23px;min-height:340px;background:#271225}.video-inner video{width:100%;height:100%;min-height:340px;object-fit:cover;display:block}.video-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:22px;background:linear-gradient(transparent 35%,#140817e8);pointer-events:none}.video-overlay h3{font-size:23px;margin:0 0 6px;color:#ffe3a0}.video-overlay p{font-size:13px;margin:0;color:#f6dcc2}.video-note{font-size:12px;color:#c9a98b;margin:10px 4px 0}
.diyaa-stage{min-height:220px;display:grid;place-items:center;position:relative;margin:12px 0 0}.diya{width:180px;height:85px;position:relative;border-radius:10px 10px 90px 90px;background:linear-gradient(#ffcf70,#e45a2d 60%,#8e272d);box-shadow:0 20px 50px #ff7c2b55;transform:perspective(200px) rotateX(8deg)}.diya:before{content:"";position:absolute;top:-20px;left:50%;transform:translateX(-50%);width:44px;height:55px;background:radial-gradient(ellipse at 50% 75%,#fff9ba 0 12%,#ffc13f 35%,#ff6a25 68%,transparent 72%);filter:drop-shadow(0 0 18px #ffb52c);border-radius:50% 50% 50% 0;rotate:45deg;animation:flame .7s ease-in-out infinite alternate}@keyframes flame{to{transform:translateX(-50%) scale(.86) rotate(-5deg)}}.diya:after{content:"";position:absolute;left:10%;right:10%;top:8px;height:18px;border-radius:50%;background:linear-gradient(#ffeab0,#9d3327);border:2px solid #ffc85f}
.section-title{margin:43px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:12px}.section-title h2{font-size:clamp(26px,4vw,38px);margin:0}.section-title p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:22px;box-shadow:0 16px 45px #0002;backdrop-filter:blur(14px);transition:.25s}.card:hover{transform:translateY(-5px);border-color:#ffd77980}.icon{width:54px;height:54px;border-radius:17px;background:linear-gradient(135deg,#ffdb8740,#f052512b);display:grid;place-items:center;font-size:27px;margin-bottom:14px}.card h3{margin:0 0 9px;color:#ffe7b0}.card p{color:var(--muted);line-height:1.7;margin:0 0 14px}.card button,.card a{color:var(--gold);background:transparent;border:0;padding:0;font-weight:850;cursor:pointer}.gallery{overflow:hidden;padding:18px 0;border-radius:25px}.track{display:flex;gap:16px;width:max-content;animation:slide 36s linear infinite}.gallery:hover .track{animation-play-state:paused}@keyframes slide{to{transform:translateX(-50%)}}.round{width:185px;height:185px;flex-shrink:0;padding:6px;border-radius:50%;background:conic-gradient(#ffe7a0,#f45f42,#a54b4c,#ffd779);box-shadow:0 12px 30px #0005}.round img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid #2c1428;display:block}.wish-card{background:linear-gradient(135deg,#4c1c30,#28112a);border:1px solid #ffd77955;border-radius:26px;padding:28px;text-align:center;box-shadow:0 20px 55px #0004}.wish-card h2{font-size:clamp(28px,5vw,46px);margin:0 0 10px}.wish-card p{color:#f0d3b4;line-height:1.8}.wish-input{width:100%;max-width:480px;padding:13px;border-radius:12px;border:1px solid var(--line);background:#170c22;color:white;font:inherit;margin:6px 0 12px}.banner{border:1px solid var(--line);border-radius:26px;padding:30px;background:linear-gradient(120deg,#4b1b31dd,#26112be8);margin:12px 0 22px}.banner h1{font-size:clamp(36px,5vw,58px);margin:10px 0}.banner p{color:var(--muted);line-height:1.8;max-width:800px}.muted{font-size:12px;color:#c9a98b;margin-top:12px}
footer{border-top:1px solid var(--line);text-align:center;padding:27px 18px;color:#c9a98b;font-size:13px}footer strong{color:var(--gold)}
@media(max-width:780px){nav{padding:10px 14px}.links{display:none;position:absolute;top:70px;left:12px;right:12px;background:#261127f5;padding:12px;border:1px solid var(--line);border-radius:18px;grid-template-columns:repeat(2,1fr);box-shadow:0 15px 40px #0008}.links.show{display:grid}.links button{text-align:left}.menu{display:block}.hero{grid-template-columns:1fr;padding-top:25px}.hero-copy{text-align:center}.hero p{margin-inline:auto}.actions{justify-content:center}.diyaa-stage{min-height:180px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.section-title{align-items:start;flex-direction:column}}
@media(max-width:480px){main{padding:16px 13px 45px}.grid{grid-template-columns:1fr}.hero{min-height:0}.video-inner,.video-inner video{min-height:245px}.round{width:150px;height:150px}.section-title{margin-top:30px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div id="sparkles" aria-hidden="true"></div>
<header class="top"><nav>
<a class="brand" href="#home"><span class="logo"><span>G</span></span><span>GITALK<small>DIWALI SPECIAL</small></span></a>
<div class="links" id="links"><button data-page="home" class="active">🏠 Home</button><button data-page="wishes">🪔 Wishes</button><button data-page="gallery">📸 Gallery</button><button data-page="games">🎉 Activities</button><button data-page="about">✨ About</button><button data-page="contact">💌 Share</button></div>
<button class="menu" id="menu">☰ Menu</button>
</nav></header>
<main id="app"></main>
<footer><strong>GITALK</strong> · दीपों का त्योहार, खुशियों की बहार 🪔<br>आप सभी को शुभ दीपावली! <span id="year"></span><div class="muted">Video and gallery images can be loaded from the supplied file or online sources.</div></footer>
<script>
const images=[
["photo-1603006905003-be475563bc59","दीप और रोशनी"],["photo-1606293926075-69a00db138a7","दीपावली सजावट"],["photo-1605379399642-870262d3d051","रंगोली"],["photo-1605600659873-d808a13e4d9a","दीये"],["photo-1577083552431-6e5fd01aa342","रंगीन उत्सव"],["photo-1607453998774-d533f65dac99","उत्सव की रौनक"],["photo-1548013146-72479768bada","भारत की संस्कृति"],["photo-1513151233558-d860c5398176","जश्न"]
];
const img=(id)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=550&q=80`;
const tile=(icon,title,desc,page)=>`<article class="card"><div class="icon">${icon}</div><h3>${title}</h3><p>${desc}</p><button data-page="${page}">Open page →</button></article>`;
function gallery(){let it=images.map(([id,t])=>`<div class="round"><img loading="lazy" src="${img(id)}" alt="${t}" title="${t}"></div>`).join("");return `<div class="gallery"><div class="track">${it}${it}</div></div>`}
const pages={
home:()=>`<section class="hero"><div class="hero-copy"><span class="eyebrow">🪔 GITALK DIWALI CELEBRATION</span><h1>✨ शुभ <span class="shine">दीपावली</span> ✨<br>खुशियों से रोशन हो आपका संसार</h1><p>दीयों की रोशनी आपके जीवन में सुख, शांति, स्वास्थ्य और समृद्धि लाए। GITALK की ओर से आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ!</p><div class="actions"><button class="btn gold" data-page="wishes">🪔 Wish someone</button><button class="btn outline" data-page="gallery">🌟 View celebration</button></div><div class="diyaa-stage"><div class="diya" aria-label="Animated diya lamp"></div></div></div><div><div class="video-box"><div class="video-inner"><video id="diwaliVideo" autoplay muted loop playsinline controls poster="${img(images[0][0])}"><source src="diwali-video.mp4" type="video/mp4">Your browser does not support video.</video><div class="video-overlay"><h3>दीपों का त्योहार 🪔</h3><p>Light • Love • Happiness • New beginnings</p></div></div></div><p class="video-note">Video auto-plays muted for browser compatibility. Tap the video speaker icon to hear sound.</p></div></section><section><div class="section-title"><div><h2>Diwali Special Pages</h2><p>Har section isi website ke andar open hota hai.</p></div></div><div class="grid">${tile("🪔","Greeting Wishes","Personalized Diwali greetings share karein.","wishes")}${tile("📸","Photo Gallery","Round auto-moving festive photos.","gallery")}${tile("🎊","Festival Activities","Safe celebration ideas and traditions.","games")}${tile("🌼","About Diwali","Festival ke meaning aur traditions.","about")}${tile("💌","Share Wishes","Apni greeting share karein.","contact")}${tile("✨","Light & Blessings","Positive festive message for everyone.","wishes")}</div></section><section><div class="section-title"><div><h2>✨ Festival Photo Gallery</h2><p>Moving round gallery — pause by hovering on desktop.</p></div></div>${gallery()}</section><section class="wish-card"><h2>🪔 दीपावली की हार्दिक शुभकामनाएँ 🪔</h2><p>आपके घर में खुशियों के दीप जलें, हर दिन नई उम्मीद लेकर आए और आपका जीवन प्रेम, शांति और सफलता से भर जाए।</p><button class="btn gold" data-page="wishes">Create a greeting →</button></section>`,
wishes:()=>`<div class="banner"><span class="eyebrow">🪔 PERSONAL GREETING MAKER</span><h1>दीपावली Wishes ✨</h1><p>अपना और अपने प्रियजन का नाम लिखकर सुंदर शुभकामना तैयार करें और WhatsApp या दूसरे ऐप पर शेयर करें।</p></div><div class="wish-card"><h2>🪔 शुभ दीपावली 🪔</h2><input class="wish-input" id="sender" placeholder="आपका नाम (optional)"><input class="wish-input" id="receiver" placeholder="किसे भेजना है? (optional)"><p id="wishText">दीयों की रोशनी आपके जीवन में खुशियाँ, सफलता और समृद्धि लाए। आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ! ✨</p><button class="btn gold" id="makeWish">✨ Personalize</button> <button class="btn outline" id="shareWish">📲 Share greeting</button><p class="muted" id="wishStatus"></p></div><section class="section-title"><div><h2>More Wishes</h2><p>Choose a message to personalize or share.</p></div></section><div class="grid">${tile("🌟","Prosperity","May your home shine with happiness, health and prosperity.","wishes")}${tile("🕯️","Peace & Light","May every diya bring hope, peace and a beautiful new beginning.","wishes")}${tile("🌸","Family & Friends","Wishing you laughter, love and memorable festive moments.","wishes")}</div>`,
gallery:()=>`<div class="banner"><span class="eyebrow">📸 FESTIVE MOMENTS</span><h1>Diwali Photo Gallery</h1><p>Round spinning gallery with online festive photos. Internet connection is required for online images.</p><button class="btn gold" id="pauseGallery">⏸ Pause gallery</button></div>${gallery()}<div class="grid" style="margin-top:22px">${images.slice(0,6).map(([id,t])=>`<article class="card"><img loading="lazy" src="${img(id)}" alt="${t}" style="width:100%;height:180px;object-fit:cover;border-radius:16px"><h3 style="margin-top:13px">${t}</h3><p>शुभ दीपावली — खुशियों और रोशनी का त्योहार।</p></article>`).join("")}</div>`,
games:()=>`<div class="banner"><span class="eyebrow">🎉 CELEBRATE RESPONSIBLY</span><h1>Diwali Activities</h1><p>Enjoy festive traditions with family, friends and neighbours. Choose light, kindness and safety.</p></div><div class="grid">${tile("🎨","Rangoli Time","Make a colourful rangoli using flower petals or reusable colours.","about")}${tile("🪔","Decorate Diyas","Decorate clay diyas and place them safely away from curtains.","about")}${tile("🍬","Share Sweets","Share homemade sweets and greetings with neighbours.","wishes")}${tile("🌱","Eco-friendly Diwali","Prefer LED lights, reusable decorations and less smoke.","about")}${tile("❤️","Kindness Challenge","Call someone you miss or help someone in your community.","wishes")}${tile("📷","Family Photo","Capture happy memories and share greetings.","gallery")}</div><div class="wish-card" style="margin-top:20px"><h2>🧡 Safe Diwali, Happy Diwali</h2><p>दीये और मोमबत्तियाँ बच्चों तथा ज्वलनशील वस्तुओं से दूर रखें। पटाखों के मामले में स्थानीय नियमों का पालन करें और पर्यावरण का ध्यान रखें।</p></div>`,
about:()=>`<div class="banner"><span class="eyebrow">🌼 FESTIVAL OF LIGHTS</span><h1>दीपावली का संदेश</h1><p>दीपावली भारत के प्रमुख त्योहारों में से एक है। यह अनेक समुदायों में प्रकाश, आशा, नई शुरुआत, परिवार और अच्छाई की जीत का प्रतीक मानी जाती है। अलग-अलग क्षेत्रों में इसकी परंपराएँ अलग हो सकती हैं।</p></div><div class="grid">${tile("🪔","प्रकाश","अंधकार में भी उम्मीद और सकारात्मकता का संदेश।","wishes")}${tile("🤝","अपनापन","परिवार, मित्रों और समुदाय के साथ खुशियाँ बाँटना।","wishes")}${tile("🌿","जिम्मेदारी","स्वच्छ, सुरक्षित और पर्यावरण का ध्यान रखने वाला उत्सव।","games")}</div><div class="wish-card" style="margin-top:20px"><h2>✨ रोशनी बाँटें, खुशियाँ बाँटें ✨</h2><p>इस दीपावली किसी के चेहरे पर मुस्कान लाएँ। छोटी-सी मदद भी बड़ा उजाला कर सकती है।</p></div>`,
contact:()=>`<div class="banner"><span class="eyebrow">💌 SHARE THE LIGHT</span><h1>Share Diwali Wishes</h1><p>नीचे अपना संदेश बनाएँ और अपने प्रियजनों तक पहुँचाएँ।</p></div><div class="wish-card"><h2>आप सभी को शुभ दीपावली! 🪔</h2><p>यह त्योहार आपके जीवन को खुशियों, प्यार और सफलता से भर दे।</p><button class="btn gold" id="shareWish">📲 Share now</button><p class="muted" id="wishStatus"></p></div>`
};
function render(page){let key=pages[page]?page:"home";document.getElementById("app").innerHTML=`<div class="page">${pages[key]()}</div>`;document.querySelectorAll("[data-page]").forEach(b=>b.addEventListener("click",()=>location.hash=b.dataset.page));document.querySelectorAll(".links button").forEach(b=>b.classList.toggle("active",b.dataset.page===key));document.getElementById("links").classList.remove("show");wire(key);window.scrollTo({top:0,behavior:"smooth"})}
function wire(page){
if(page==="wishes"){document.getElementById("makeWish")?.addEventListener("click",()=>{let from=document.getElementById("sender").value.trim(),to=document.getElementById("receiver").value.trim();document.getElementById("wishText").textContent=`${to?to+" जी, ":""}दीयों की रोशनी आपके जीवन में खुशियाँ, सफलता और समृद्धि लाए। आपको और आपके परिवार को दीपावली की हार्दिक शुभकामनाएँ! ✨${from?" — "+from:""}`;document.getElementById("wishStatus").textContent="आपकी greeting तैयार है। अब Share greeting दबाएँ।"});}
document.getElementById("shareWish")?.addEventListener("click",async()=>{let text=document.getElementById("wishText")?.textContent||"आप सभी को दीपावली की हार्दिक शुभकामनाएँ! 🪔✨";let msg=text+" — GITALK";try{if(navigator.share){await navigator.share({title:"शुभ दीपावली",text:msg,url:location.href})}else{await navigator.clipboard.writeText(msg);document.getElementById("wishStatus").textContent="Greeting copied! WhatsApp खोलकर paste करें."}}catch(e){document.getElementById("wishStatus").textContent="Share cancel hua ya copy unavailable hai. Text ko manually copy karein."}});
if(page==="gallery"){let paused=false;document.getElementById("pauseGallery")?.addEventListener("click",()=>{paused=!paused;document.querySelectorAll(".track").forEach(t=>t.style.animationPlayState=paused?"paused":"running");document.getElementById("pauseGallery").textContent=paused?"▶ Resume gallery":"⏸ Pause gallery"})}
}
function route(){render(location.hash.slice(1)||"home")}
document.getElementById("menu").addEventListener("click",()=>document.getElementById("links").classList.toggle("show"));window.addEventListener("hashchange",route);document.getElementById("year").textContent=new Date().getFullYear();
for(let i=0;i<75;i++){let s=document.createElement("i");s.className="spark";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.animationDelay=Math.random()*2+"s";s.style.opacity=(.25+Math.random()*.7).toFixed(2);document.getElementById("sparkles").appendChild(s)}
route();
</script>
</body>
</html>
