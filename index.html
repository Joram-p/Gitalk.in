<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gitalk Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
      padding-bottom: 70px;
    }

    button,
    label {
      cursor: pointer;
    }

    /* HEADER */
    header {
      background: #1877f2;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    .headerRight {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #userEmail {
      font-size: 13px;
      max-width: 180px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #logoutBtn {
      background: white;
      color: #1877f2;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
    }

    /* AUTH */
    #authSection {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 14px;
      box-shadow: 0 2px 10px #ccc;
    }

    #authSection h2 {
      text-align: center;
      color: #1877f2;
      margin-bottom: 20px;
    }

    #authSection input {
      width: 100%;
      padding: 13px;
      margin: 7px 0;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
    }

    .authBtn {
      width: 100%;
      padding: 13px;
      background: #1877f2;
      color: white;
      border-radius: 9px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    #authMessage {
      text-align: center;
      margin-top: 12px;
      font-size: 14px;
      word-break: break-word;
    }

    .switchAuth {
      text-align: center;
      color: #1877f2;
      margin-top: 16px;
      cursor: pointer;
    }

    /* APP */
    #appSection {
      display: none;
      max-width: 650px;
      margin: auto;
      padding: 15px;
    }

    /* CREATE POST */
    .createPost {
      background: white;
      padding: 15px;
      border-radius: 14px;
      margin-bottom: 15px;
      box-shadow: 0 1px 5px #ccc;
    }

    #postText {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 11px;
      font-size: 17px;
      outline: none;
    }

    #postText:focus {
      border-color: #1877f2;
    }

    .mediaButtons {
      display: flex;
      gap: 12px;
      margin-top: 12px;
    }

    .mediaButton {
      flex: 1;
      padding: 13px;
      background: #f0f2f5;
      border-radius: 10px;
      text-align: center;
      font-size: 18px;
      font-weight: bold;
    }

    .mediaButton:active {
      background: #dfe3e8;
    }

    .createBtn {
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      background: #1877f2;
      color: white;
      border-radius: 10px;
      font-size: 17px;
      font-weight: bold;
    }

    #uploadStatus {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: #eef5ff;
      color: #1877f2;
      text-align: center;
      font-size: 14px;
    }

    /* POSTS */
    .post {
      background: white;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 15px;
      box-shadow: 0 1px 5px #ccc;
    }

    .postHeader {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .postUser {
      color: #1877f2;
      font-weight: bold;
    }

    .postDate {
      color: #777;
      font-size: 12px;
    }

    .postText {
      white-space: pre-wrap;
      word-break: break-word;
      margin-bottom: 10px;
      font-size: 16px;
    }

    .post img {
      width: 100%;
      max-height: 600px;
      object-fit: contain;
      border-radius: 10px;
      background: #000;
      display: block;
    }

    .post video {
      width: 100%;
      max-height: 600px;
      border-radius: 10px;
      background: #000;
      display: block;
    }

    .postActions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #eee;
    }

    .postActions button {
      flex: 1;
      padding: 10px 5px;
      background: #f0f2f5;
      border-radius: 8px;
      font-weight: bold;
      font-size: 14px;
    }

    .postActions button.liked {
      color: #1877f2;
    }

    /* COMMENTS */
    .comments {
      margin-top: 10px;
    }

    .comment {
      background: #f0f2f5;
      border-radius: 8px;
      padding: 9px;
      margin-top: 6px;
      font-size: 14px;
    }

    .commentUser {
      font-weight: bold;
      color: #1877f2;
    }

    .emptyFeed {
      background: white;
      padding: 35px 15px;
      text-align: center;
      border-radius: 14px;
      color: #777;
    }

    /* BOTTOM NAV */
    .bottomNav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      height: 62px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
    }

    .bottomNav button {
      background: none;
      color: #555;
      font-size: 13px;
    }

    .bottomNav span {
      display: block;
      font-size: 22px;
      margin-bottom: 2px;
    }

    /* MOBILE */
    @media (max-width: 600px) {

      header {
        padding: 10px;
      }

      .logo {
        font-size: 22px;
      }

      #userEmail {
        max-width: 120px;
      }

      #appSection {
        padding: 10px;
      }

      .post {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>

  <div class="logo">
    Gitalk.in
  </div>

  <div class="headerRight">

    <span id="userEmail"></span>

    <button
      id="logoutBtn"
      onclick="logout()"
      style="display:none;"
    >
      Logout
    </button>

  </div>

</header>


<!-- LOGIN / SIGNUP -->
<section id="authSection">

  <h2 id="authTitle">
    Login to Gitalk
  </h2>

  <input
    type="email"
    id="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    class="authBtn"
    id="authButton"
    onclick="login()"
  >
    Login
  </button>

  <div id="authMessage"></div>

  <div
    class="switchAuth"
    id="switchAuth"
    onclick="toggleAuth()"
  >
    Create new account
  </div>

</section>


<!-- MAIN APP -->
<section id="appSection">

  <!-- CREATE POST -->
  <div class="createPost">

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>


    <!-- PHOTO / VIDEO -->
    <div class="mediaButtons">

      <label
        for="photoInput"
        class="mediaButton"
      >
        📷 Photo
      </label>

      <label
        for="videoInput"
        class="mediaButton"
      >
        🎥 Video
      </label>

    </div>


    <!-- PHOTO INPUT -->
    <input
      type="file"
      id="photoInput"
      accept="image/*"
      style="display:none;"
      onchange="handlePhoto(event)"
    >


    <!-- VIDEO INPUT -->
    <input
      type="file"
      id="videoInput"
      accept="video/*"
      style="display:none;"
      onchange="handleVideo(event)"
    >


    <!-- STATUS -->
    <div id="uploadStatus"></div>


    <!-- CREATE TEXT POST -->
    <button
      class="createBtn"
      onclick="createPost()"
    >
      ➕ Create Post
    </button>

  </div>


  <!-- FEED -->
  <div id="feed">

    <div class="emptyFeed">
      Loading Gitalk Social...
    </div>

  </div>

</section>


<!-- BOTTOM NAV -->
<div class="bottomNav">

  <button onclick="goHome()">
    <span>🏠</span>
    Home
  </button>

  <button onclick="goProfile()">
    <span>👤</span>
    Profile
  </button>

  <button onclick="goFriends()">
    <span>👥</span>
    Friends
  </button>

  <button onclick="goMessages()">
    <span>💬</span>
    Messages
  </button>

  <button onclick="goSettings()">
    <span>⚙️</span>
    Settings
  </button>

</div>


<!-- ONLY ONE JAVASCRIPT FILE -->
<script type="module" src="script.js"></script>

</body>
</html>
