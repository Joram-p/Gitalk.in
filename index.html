<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gitalk Social</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>

<section id="authSection" class="authSection">

  <div id="loginBox" class="authBox">
    <h1>Gitalk ❤️</h1>
    <h2>Login</h2>

    <div id="authMessage"></div>

    <input id="loginEmail" type="email" placeholder="Email">
    <input id="loginPassword" type="password" placeholder="Password">

    <button class="authBtn" onclick="login()">Login</button>

    <p class="authLink" onclick="showSignup()">
      Create new account
    </p>
  </div>

  <div id="signupBox" class="authBox" style="display:none">
    <h1>Gitalk ❤️</h1>
    <h2>Create Account</h2>

    <input id="signupName" type="text" placeholder="Full Name">
    <input id="signupEmail" type="email" placeholder="Email">
    <input id="signupPassword" type="password" placeholder="Password">

    <button class="authBtn" onclick="signup()">
      Sign Up
    </button>

    <p class="authLink" onclick="showLogin()">
      Already have an account? Login
    </p>
  </div>

</section>


<section id="appSection" style="display:none">

  <header class="appHeader">
    <h1>Gitalk</h1>

    <div>
      <span id="userEmail"></span>
      <button id="logoutBtn" onclick="logout()">Logout</button>
    </div>
  </header>


  <!-- HOME -->
  <main id="homePage" class="appPage">

    <div class="createPost">

      <div class="postUser">
        <img id="homePhoto"
             class="postAvatar"
             src=""
             alt="Profile">

        <div>
          <strong id="homeUserName">
            Gitalk User
          </strong>

          <div id="homeUsername">
            @user
          </div>
        </div>
      </div>

      <textarea
        id="postText"
        placeholder="What's on your mind?"
      ></textarea>

      <div class="mediaButtons">

        <label class="mediaButton">
          📷 Photo
          <input
            id="photoInput"
            type="file"
            accept="image/*"
          >
        </label>

        <label class="mediaButton">
          🎥 Video
          <input
            id="videoInput"
            type="file"
            accept="video/*"
          >
        </label>

      </div>

      <div id="uploadStatus"></div>

      <button
        class="createBtn"
        onclick="createPost()"
      >
        Post
      </button>

    </div>

    <div id="feed" class="feed">
      <div class="emptyFeed">
        Loading posts...
      </div>
    </div>

  </main>


  <!-- PROFILE -->
  <main id="profilePage" class="appPage">

    <div class="profileCard">

      <img
        id="profilePhoto"
        src=""
        alt="Profile"
      >

      <h2 id="profileName">
        Gitalk User
      </h2>

      <p id="profileUsername">
        @user
      </p>

      <p id="profileBio">
        Welcome to Gitalk ❤️
      </p>

      <p id="profileLocation"></p>
      <p id="profileWebsite"></p>

      <div class="profileStats">

        <div>
          <strong id="postsCount">0</strong>
          <span>Posts</span>
        </div>

        <div>
          <strong id="followersCount">0</strong>
          <span>Followers</span>
        </div>

        <div>
          <strong id="likesCount">0</strong>
          <span>Likes</span>
        </div>

      </div>

      <button
        class="saveBtn"
        onclick="showPage('editPage')"
      >
        Edit Profile
      </button>

    </div>

  </main>


  <!-- EDIT PROFILE -->
  <main id="editPage" class="appPage">

    <div class="editCard">

      <h2>Edit Profile</h2>

      <img
        id="editProfilePhoto"
        class="editProfilePhoto"
        src=""
        alt="Profile"
      >

      <input
        id="profileImageInput"
        type="file"
        accept="image/*"
        onchange="previewProfileImage(event)"
      >

      <div id="profileUploadStatus"></div>

      <input
        id="nameInput"
        type="text"
        placeholder="Name"
      >

      <input
        id="usernameInput"
        type="text"
        placeholder="Username"
      >

      <textarea
        id="bioInput"
        placeholder="Bio"
      ></textarea>

      <input
        id="locationInput"
        type="text"
        placeholder="Location"
      >

      <input
        id="websiteInput"
        type="url"
        placeholder="Website"
      >

      <button
        class="saveBtn"
        onclick="saveFirebaseProfile()"
      >
        Save Profile
      </button>

    </div>

  </main>


  <!-- SETTINGS -->
  <main id="settingsPage" class="appPage">

    <div class="settingsCard">

      <h2>Settings</h2>

      <div class="settingRow">
        <span>Notifications</span>
        <input
          id="notificationsToggle"
          type="checkbox"
          checked
        >
      </div>

      <div class="settingRow">
        <span>Private Account</span>
        <input
          id="privateToggle"
          type="checkbox"
        >
      </div>

      <div class="settingRow">
        <span>Messages</span>
        <input
          id="messagesToggle"
          type="checkbox"
          checked
        >
      </div>

      <div class="settingRow">
        <span>Dark Mode</span>
        <input
          id="darkToggle"
          type="checkbox"
        >
      </div>

      <button
        class="saveBtn"
        onclick="saveSettings()"
      >
        Save Settings
      </button>

    </div>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottomNav">

    <button onclick="showPage('homePage')">
      🏠 Home
    </button>

    <button onclick="focusPost()">
      ➕ Post
    </button>

    <button onclick="showPage('profilePage')">
      👤 Profile
    </button>

    <button onclick="showPage('settingsPage')">
      ⚙️ Settings
    </button>

  </nav>

</section>


<script type="module" src="./script.js"></script>

</body>
</html>
