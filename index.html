<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Gitalk Social</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f2f5;
      color: #222;
    }

    button {
      cursor: pointer;
      border: none;
    }

    /* HEADER */
    header {
      background: #1877f2;
      color: white;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
    }

    #userEmail {
      font-size: 12px;
      max-width: 150px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* AUTH */
    #authSection {
      max-width: 420px;
      margin: 50px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #ccc;
    }

    #authSection h2 {
      text-align: center;
      margin-bottom: 20px;
      color: #1877f2;
    }

    #authSection input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 15px;
    }

    .authBtn {
      width: 100%;
      padding: 13px;
      background: #1877f2;
      color: white;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    #authMessage {
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    .switchAuth {
      text-align: center;
      margin-top: 15px;
      color: #1877f2;
      cursor: pointer;
    }

    /* APP */
    #appSection {
      display: none;
      max-width: 650px;
      margin: auto;
      padding: 15px;
      padding-bottom: 80px;
    }

    /* CREATE POST */
    .createPost {
      background: white;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      box-shadow: 0 1px 4px #ccc;
    }

    .createPost textarea {
      width: 100%;
      min-height: 90px;
      padding: 12px;
      resize: vertical;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    .postButtons {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    .postButtons button {
      flex: 1;
      min-width: 120px;
      padding: 11px;
      border-radius: 8px;
      background: #f0f2f5;
      font-weight: bold;
    }

    .postBtn {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      background: #1877f2 !important;
      color: white;
      border-radius: 8px;
      font-size: 16px;
    }

    /* POST */
    .post {
      background: white;
      border-radius: 12px;
      margin-bottom: 15px;
      padding: 15px;
      box-shadow: 0 1px 4px #ccc;
    }

    .postHeader {
      font-weight: bold;
      margin-bottom: 8px;
      color: #1877f2;
    }

    .postText {
      margin-bottom: 10px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .post img {
      width: 100%;
      max-height: 500px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 8px;
    }

    .post video {
      width: 100%;
      max-height: 500px;
      border-radius: 10px;
      margin-top: 8px;
      background: #000;
    }

    .postActions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }

    .postActions button {
      flex: 1;
      padding: 9px;
      background: #f0f2f5;
      border-radius: 7px;
      font-weight: bold;
    }

    .comments {
      margin-top: 10px;
    }

    .comment {
      background: #f0f2f5;
      padding: 8px;
      margin-top: 5px;
      border-radius: 8px;
      font-size: 14px;
    }

    /* BOTTOM NAV */
    .bottomNav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 58px;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 200;
    }

    .bottomNav button {
      background: none;
      font-size: 13px;
      color: #555;
    }

    /* LOGOUT */
    #logoutBtn {
      background: white;
      color: #1877f2;
      padding: 7px 10px;
      border-radius: 7px;
      font-weight: bold;
    }

    /* STATUS */
    #uploadStatus {
      margin-top: 10px;
      padding: 8px;
      text-align: center;
      font-size: 14px;
      display: none;
    }

    @media (max-width: 600px) {
      #appSection {
        padding: 10px;
      }

      header {
        padding: 10px;
      }

      .logo {
        font-size: 22px;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">Gitalk.in</div>

  <div>
    <span id="userEmail"></span>
    <button id="logoutBtn" onclick="logout()" style="display:none;">
      Logout
    </button>
  </div>
</header>


<!-- LOGIN / SIGNUP -->
<section id="authSection">

  <h2 id="authTitle">Login to Gitalk</h2>

  <input
    type="email"
    id="email"
    placeholder="Email address"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button class="authBtn" id="authButton" onclick="login()">
    Login
  </button>

  <div id="authMessage"></div>

  <div class="switchAuth" onclick="toggleAuth()">
    Create new account
  </div>

</section>


<!-- MAIN APP -->
<section id="appSection">

  <!-- CREATE POST -->
  <div class="createPost">

    <textarea
      id="postText"
      placeholder="What's on your mind?"
    ></textarea>

    <!-- PHOTO / VIDEO BUTTONS -->
    <div class="postButtons">

      <button onclick="selectPhoto()">
        📷 Photo
      </button>

      <button onclick="selectVideo()">
        🎥 Video
      </button>

    </div>


    <!-- HIDDEN PHOTO INPUT -->
    <input
      type="file"
      id="photoInput"
      accept="image/*"
      style="display:none;"
      onchange="handlePhoto(event)"
    >


    <!-- HIDDEN VIDEO INPUT -->
    <input
      type="file"
      id="videoInput"
      accept="video/*"
      style="display:none;"
      onchange="handleVideo(event)"
    >


    <!-- UPLOAD STATUS -->
    <div id="uploadStatus"></div>


    <!-- TEXT POST -->
    <button
      class="postBtn"
      onclick="createPost()"
    >
      ➕ Create Post
    </button>

  </div>


  <!-- FEED -->
  <div id="feed">

    <div class="post">
      <div class="postHeader">
        Gitalk Social
      </div>

      <div class="postText">
        Welcome to Gitalk Social ❤️
      </div>
    </div>

  </div>

</section>


<!-- BOTTOM NAV -->
<div class="bottomNav">

  <button onclick="goHome()">
    🏠<br>Home
  </button>

  <button onclick="goProfile()">
    👤<br>Profile
  </button>

  <button onclick="goFriends()">
    👥<br>Friends
  </button>

  <button onclick="goMessages()">
    💬<br>Messages
  </button>

  <button onclick="goSettings()">
    ⚙️<br>Settings
  </button>

</div>


<!-- FIREBASE -->
<script type="module">

  import {
    initializeApp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

  import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

  import {
    getFirestore,
    doc,
    setDoc,
    serverTimestamp
  } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";


  /* FIREBASE CONFIG */

  const firebaseConfig = {

    apiKey: "AIzaSyBDz7YkD4ivdet3kjJ1HcmfCUbS8WOc25I",

    authDomain: "gitalk-social-3a85a.firebaseapp.com",

    projectId: "gitalk-social-3a85a",

    storageBucket: "gitalk-social-3a85a.firebasestorage.app",

    messagingSenderId: "553434284005",

    appId: "1:553434284005:web:e934097f7f7228d2b8b90c"

  };


  /* INITIALIZE */

  const app = initializeApp(firebaseConfig);

  const auth = getAuth(app);

  const db = getFirestore(app);


  /* AUTH MODE */

  let signupMode = false;


  window.toggleAuth = function() {

    signupMode = !signupMode;

    const title = document.getElementById("authTitle");
    const button = document.getElementById("authButton");
    const switchText = document.querySelector(".switchAuth");

    document.getElementById("authMessage").innerText = "";

    if (signupMode) {

      title.innerText = "Create Gitalk Account";

      button.innerText = "Sign Up";

      button.onclick = signup;

      switchText.innerText = "Already have an account? Login";

    } else {

      title.innerText = "Login to Gitalk";

      button.innerText = "Login";

      button.onclick = login;

      switchText.innerText = "Create new account";

    }

  };


  /* SIGNUP */

  window.signup = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      showAuthMessage("Email और password डालें.");

      return;
    }


    if (password.length < 6) {

      showAuthMessage("Password कम से कम 6 characters का होना चाहिए.");

      return;
    }


    try {

      showAuthMessage("Account बनाया जा रहा है...");

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );

      const user = userCredential.user;


      /* USER PROFILE */

      await setDoc(
        doc(db, "users", user.uid),
        {
          uid: user.uid,
          email: user.email,
          displayName: "Gitalk User",
          photoURL: "",
          createdAt: serverTimestamp()
        }
      );


      showAuthMessage("Account successfully created ❤️");

    } catch (error) {

      showAuthMessage(
        "Error: " + error.message
      );

    }

  };


  /* LOGIN */

  window.login = async function() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;


    if (!email || !password) {

      showAuthMessage("Email और password डालें.");

      return;
    }


    try {

      showAuthMessage("Login हो रहा है...");

      await signInWithEmailAndPassword(
        auth,
        email,
        password
      );

      showAuthMessage("Login successful ❤️");

    } catch (error) {

      showAuthMessage(
        "Login Error: " + error.message
      );

    }

  };


  /* LOGOUT */

  window.logout = async function() {

    try {

      await signOut(auth);

    } catch (error) {

      alert(error.message);

    }

  };


  /* AUTH STATE */

  onAuthStateChanged(auth, function(user) {

    const authSection =
      document.getElementById("authSection");

    const appSection =
      document.getElementById("appSection");

    const logoutBtn =
      document.getElementById("logoutBtn");

    const userEmail =
      document.getElementById("userEmail");


    if (user) {

      authSection.style.display = "none";

      appSection.style.display = "block";

      logoutBtn.style.display = "inline-block";

      userEmail.innerText = user.email;

    } else {

      authSection.style.display = "block";

      appSection.style.display = "none";

      logoutBtn.style.display = "none";

      userEmail.innerText = "";

    }

  });


  function showAuthMessage(message) {

    document.getElementById(
      "authMessage"
    ).innerText = message;

  }

</script>


<!-- MAIN SCRIPT -->
<script type="module" src="script.js"></script>

</body>
     </html>
