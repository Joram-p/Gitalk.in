<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Gitalk</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <main class="auth-container">
    <a href="index.html" class="brand">Gitalk<span>.</span></a>

    <section class="auth-card">
      <div class="auth-icon">✨</div>
      <h1>Join Gitalk</h1>
      <p class="subtitle">Create your account and start connecting.</p>

      <form id="registerForm">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name"
               autocomplete="name" maxlength="60" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="you@example.com"
               autocomplete="email" required>

        <label for="password">Create Password</label>
        <input type="password" id="password" placeholder="At least 6 characters"
               autocomplete="new-password" minlength="6" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword"
               placeholder="Enter password again"
               autocomplete="new-password" minlength="6" required>

        <label class="terms">
          <input type="checkbox" id="terms" required>
          I agree to the Terms of Service and Privacy Policy.
        </label>

        <button type="submit" class="auth-button" id="registerButton">
          Create Account
        </button>

        <p id="authMessage" class="message" role="status" aria-live="polite"></p>
      </form>

      <p class="switch-page">
        Already registered?
        <a href="login.html">Login here</a>
      </p>
    </section>

    <p class="auth-footer">Gitalk — where people connect through conversation.</p>
  </main>

  <script type="module" src="auth.js"></script>
</body>
</html>
